<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Performance Contact Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f9;--card:#fff;--tx:#14213d;--mut:#6b7791;--bd:#e1e6ef;--pri:#1d4ed8;--red:#fde8e8;--redt:#b91c1c;--amb:#fff4d6;--ambt:#92400e;--grn:#e3f6ea;--grnt:#15803d;--hd:#0f1c3f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#141b30;--tx:#e8edf8;--mut:#8f9bb8;--bd:#25304d;--pri:#6d9bff;--red:#4a1d24;--redt:#ff9a9a;--amb:#4a3912;--ambt:#ffd27a;--grn:#12372a;--grnt:#6ee7a0;--hd:#070b17}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#141b30;--tx:#e8edf8;--mut:#8f9bb8;--bd:#25304d;--pri:#6d9bff;--red:#4a1d24;--redt:#ff9a9a;--amb:#4a3912;--ambt:#ffd27a;--grn:#12372a;--grnt:#6ee7a0;--hd:#070b17}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
header{background:var(--hd);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{font-size:17px;margin:0;letter-spacing:.3px}header small{opacity:.65;display:block;font-weight:400}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:transparent;border:0;color:#cbd5ee;padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit;font-weight:600}
nav button.on{background:#1d4ed8;color:#fff}
main{max-width:1400px;margin:0 auto;padding:16px 20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
input,select,button.b{font:inherit;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
button.b{cursor:pointer;font-weight:600}button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.top-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:14px}
.top-box{border-radius:10px;padding:10px 14px;border:1px solid var(--bd)}
.top-box.best{background:var(--grn);border-color:#bbf7d0;color:var(--grnt)}
.top-box.worst{background:var(--red);border-color:#fecaca;color:var(--redt)}
.top-box h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow-x:auto;margin-bottom:14px}
table{border-collapse:collapse;width:100%}th{background:var(--bg);text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:8px 10px;white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--bd);white-space:nowrap;font-size:13px}td.n{font-weight:600}
.v-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-weight:700;background:var(--red);color:var(--redt)}
.ok-badge{color:var(--grnt);font-weight:600}
td.c{text-align:center}.hint{color:var(--mut);font-size:12px;margin:0 0 10px}.empty{padding:30px;text-align:center;color:var(--mut)}
input.t{width:85px}h2{font-size:14px;margin:14px 0 6px}.tag{font-size:11px;color:var(--mut)}
@media print{header,.bar,.hint{display:none}}
header{background:linear-gradient(120deg,#0b1736,#1e3a8a);box-shadow:0 2px 10px rgba(0,0,0,.2)}th{position:sticky;top:0;z-index:1}td.n{position:sticky;left:0;background:var(--card)}tbody tr:hover td:not(.v-badge){background:rgba(29,78,216,.04)}.card.pad{padding:10px 14px}
</style></head><body>
<header><h1>Performance Contact Center<small>Agent attendance &amp; conduct monitoring</small></h1>
<nav id="nav"></nav><span id="st" style="font-size:12px;color:#cbd5ee"></span><button class="b" id="so">Sign out</button><button class="b" id="th">◐ Theme</button></header>
<main id="app"></main>
<script>
const LIM={grace:300,emerg:180,brk:43*60,work:300,cna:6,shift:8*3600};
let S={days:{},idx:{},shifts:{},ex:{}},tab='dash',date='',month='';const FB_CONFIG={apiKey:"AIzaSyC5wAmajiFgKEAfi4Ay0ZA1QGL-KS4K9zo",authDomain:"performance-control-ab7f9.firebaseapp.com",projectId:"performance-control-ab7f9",storageBucket:"performance-control-ab7f9.firebasestorage.app",messagingSenderId:"599359001764",appId:"1:599359001764:web:8ae96947247d8036b60231"};
let MEN='',DB=null,ME=null,LOADED={},LOGS=null,USER_ROLE='editor';
try{const r=localStorage.getItem('pcc_v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{if(DB)return;try{localStorage.setItem('pcc_v1',JSON.stringify(S))}catch(e){}};
const $=q=>document.querySelector(q);
const pad=n=>String(n).padStart(2,'0');
const hms=s=>pad(Math.floor(s/3600)%24)+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60);
const dmy=d=>d.split('-').reverse().join('/');
const mn=s=>Math.floor(s/60);
const formatDuration=(mTotal)=>{
  if(!mTotal||mTotal<=0)return'0 min';
  const h=Math.floor(mTotal/60), m=mTotal%60;
  if(h>0) return h+':'+pad(m)+' min';
  return m+' min';
};
const tosec=h=>{const m=/^(\d+):(\d+)/.exec(h||'');return m?m[1]*3600+m[2]*60:null};
const addDays=(dStr,n)=>{const d=new Date(dStr+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};

function pt(v){
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400)*1000);return[d.toISOString().slice(0,10),d.getUTCHours()*3600+d.getUTCMinutes()*60+d.getUTCSeconds()]}
  const m=/(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+):(\d+)\s*(AM|PM)?/i.exec(String(v));if(!m)return null;
  let y=+m[3];if(y<100)y+=2000;let h=+m[4]%12;if(/pm/i.test(m[7]||''))h+=12;if(!m[7])h=+m[4];
  return[y+'-'+pad(m[1])+'-'+pad(m[2]),h*3600+m[5]*60+ +m[6]}
function pd(v){if(typeof v==='number')return Math.round(v*86400);const m=/(\d+):(\d+):(\d+)/.exec(String(v));return m?m[1]*3600+m[2]*60+ +m[3]:0}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function saveDay(d){
  if(!DB){save();return}
  const ag=S.days[d],parts=[];let cur={},sz=0;
  Object.keys(ag).forEach(n=>{const l=JSON.stringify(ag[n]).length;if(sz+l>200000&&Object.keys(cur).length){parts.push(cur);cur={};sz=0}cur[n]=ag[n];sz+=l});parts.push(cur);
  const old=(S.idx[d]&&S.idx[d].p)||0;
  for(let i=0;i<parts.length;i++)await DB.doc('days/'+d+'_'+i).set({date:d,month:d.slice(0,7),agents:JSON.stringify(parts[i])});
  for(let i=parts.length;i<old;i++)try{await DB.doc('days/'+d+'_'+i).delete()}catch(e){}
  S.idx[d].p=parts.length}
async function saveIdx(){if(!DB){save();return}await DB.doc('meta/index').set({dates:S.idx})}
function persistMap(c,k){if(!DB){save();return}const m=k.slice(0,7),src=c==='ex'?S.ex:S.shifts,sub={};
  Object.keys(src).filter(x=>x.startsWith(m)).forEach(x=>sub[x]=src[x]);DB.doc(c+'/'+m).set({m:sub}).catch(()=>{})}
async function loadMonth(m){if(!DB||LOADED[m])return;
  try{const q=await DB.collection('days').where('month','==',m).get();q.docs.forEach(x=>{const v=x.data();S.days[v.date]=Object.assign(S.days[v.date]||{},typeof v.agents==='string'?JSON.parse(v.agents):v.agents)});
    for(const c of ['ex','sh']){const g=await DB.doc(c+'/'+m).get();if(g.exists)Object.assign(c==='ex'?S.ex:S.shifts,g.data().m||{})}}catch(e){}
  LOADED[m]=1}

function showLogin(msg){let m=document.getElementById('lg');if(!m){m=document.createElement('div');m.id='lg';m.style.cssText='position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px';
  m.innerHTML=`<div class="card" style="padding:28px;width:min(400px,100%);overflow:visible;margin:0"><h2 style="margin-top:0;font-size:20px">Performance Contact Center</h2><p class="hint">Sign in to continue</p><div style="display:grid;gap:10px"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="b p" id="si">Sign in</button><span id="le" style="color:var(--redt);font-size:12px"></span></div></div>`;
  document.body.appendChild(m);
  const go=async()=>{$('#le').textContent='';try{await firebase.auth().signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value)}catch(e){$('#le').textContent='Sign-in failed: '+(e.code||e.message)}};
  $('#si').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()}}
  if(msg)$('#le').textContent=msg}
function hideLogin(){const m=document.getElementById('lg');if(m)m.remove()}

async function boot(){
  if(!window.firebase){showLogin('Firebase error.');return}
  firebase.initializeApp(FB_CONFIG);const auth=firebase.auth();
  auth.onAuthStateChanged(async u=>{
    if(!u){DB=null;$('#app').innerHTML='';showLogin();return}
    hideLogin();DB=firebase.firestore();ME=u.uid;MEN=u.email||'';
    try{
      const uDoc=await DB.doc('users/'+ME).get();
      if(uDoc.exists)USER_ROLE=uDoc.data().role||'editor';
      const g=await DB.doc('meta/index').get();S.idx=g.exists?(g.data().dates||{}):{}
    }catch(e){}
    S.days={};S.ex={};S.shifts={};LOADED={};date='';month='';
    $('#st').textContent='\u25cf '+MEN;render()})}

function importFile(f){
  const rd=new FileReader();rd.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true});
    const hi=rows.findIndex(r=>String(r[0]||'').trim()==='Agent Name');if(hi<0){alert('Header not found');return}
    const ag={},seenR={};
    rows.slice(hi+1).forEach(r=>{
      if(!r[0]||!r[3])return;const t=pt(r[3]);if(!t)return;
      const name=String(r[0]).trim(),st=String(r[4]||'').trim(),re=String(r[5]||'').trim(),d=pd(r[6]);
      const k=t[0]+'|'+name;let ev=null;
      if(/^logged-in/i.test(st)){ev=[t[1],'I','',0];seenR[k]=0}
      else if(/^logout/i.test(st))ev=[t[1],'O',re,0];
      else if(/^ready/i.test(st)){if(!seenR[k]){seenR[k]=1;ev=[t[1],'R','',0]}}
      else if(/^not ready/i.test(st)&&/^(break|work)$|no answer/i.test(re))ev=[t[1],'N',re,d];
      else if(/^(reserved|receiv)/i.test(st)&&d<=10)ev=[t[1],'V','',d];
      if(!ev)return;(ag[t[0]]=ag[t[0]]||{});(ag[t[0]][name]=ag[t[0]][name]||[]).push(ev)});
    const ds=Object.keys(ag);if(!ds.length){alert('No valid rows');return}
    ds.sort();
    if(WANT&&!ds.includes(WANT)){alert('This file has no data for '+dmy(WANT)+'.\nIt contains: '+ds.map(dmy).join(', ')+'.\nNothing was imported.');WANT=null;return}
    const dup=ds.filter(d=>S.idx[d]);
    const apply=async keep=>{for(const d of keep){S.days[d]=ag[d];S.idx[d]={a:Object.keys(ag[d]).length,t:Date.now(),f:f.name||'',p:0};await saveDay(d);logA('Import',dmy(d)+' \u00b7 '+(f.name||'file')+' \u00b7 '+S.idx[d].a+' agents')}
      if(keep.length){await saveIdx();date=(WANT&&keep.includes(WANT))?WANT:keep[keep.length-1];month=date.slice(0,7);tab='dash'}WANT=null;render()};
    if(dup.length)ask(dup,ag,apply,ds);else apply(ds);
  };rd.readAsArrayBuffer(f)}

let WANT=null;
const exOn=v=>v===1||!!(v&&v.e==1);
const VN={late:'Late arrival',emerg:'Emergency',brk:'Break overrun',work:'Work overrun',cna:'Call No Answer'};
function openNote(k){
  const [d,n,t]=k.split('|'),cur=S.ex[k],on=exOn(cur),note=(cur&&cur.n)||'';
  const m=document.createElement('div');m.id='mdl';m.dataset.k=k;m.style.cssText=MS;
  m.innerHTML=`<div class="card" style="padding:22px;width:min(480px,100%);overflow:visible;margin:0"><h2 style="margin-top:0;font-size:18px">${esc(n)}</h2>
  <p class="hint" style="margin:0 0 12px">${dmy(d)} \u00b7 ${VN[t]||t} \u00b7 ${on?'<span class="chip good">Excused</span>':'<span class="chip bad">Open violation</span>'}</p>
  <label class="tag">Note \u2014 what the employee told you, who approved, etc.</label>
  <textarea id="nt" rows="4" style="width:100%;margin:6px 0 12px;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)">${esc(note)}</textarea>
  <div class="bar" style="margin:0"><button class="b p" id="nx1">${on?'Save note':'Excuse &amp; save note'}</button>${on?'<button class="b" id="nx0">Remove excuse</button>':'<button class="b" id="nxs">Save note only</button>'}<button class="b" id="xc" style="margin-left:auto">Cancel</button></div>
  ${cur&&cur.by?`<p class="tag" style="margin:10px 0 0">Last edit: ${esc(cur.by)} \u00b7 ${new Date(cur.t).toLocaleString()}</p>`:''}</div>`;
  document.body.appendChild(m)}
function saveNote(excused){const m=document.getElementById('mdl');if(!m)return;const k=m.dataset.k,note=($('#nt').value||'').trim(),was=exOn(S.ex[k]);
  if(!excused&&!note)delete S.ex[k];else S.ex[k]={e:excused?1:0,n:note,by:MEN,t:Date.now()};
  persistMap('ex',k);logA(excused?(was?'Excused (note updated)':'Excuse'):(note?'Note':'Restore violation'),k.split('|').reverse().join(' \u00b7 ')+(note?' \u2014 '+note:''));
  m.remove();render()}
const rcnt=o=>(o.recv[1]||0)+(o.recv[2]||0);
const MS='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px';
const adj=m=>{const y=+m.slice(0,4),k=+m.slice(5),f=(a,b)=>a+'-'+pad(b);return[m,k===1?f(y-1,12):f(y,k-1),k===12?f(y+1,1):f(y,k+1)]};
function pickFile(){const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls';i.onchange=()=>{if(i.files[0])importFile(i.files[0])};i.click()}
function ask(dup,ag,apply,ds){const m=document.createElement('div');m.id='mdl';m.style.cssText=MS;
  m.innerHTML=`<div class="card" style="padding:22px;max-width:480px;overflow:visible;margin:0"><h2 style="margin-top:0">Data for this date already exists</h2><p>${dup.map(d=>`<b>${dmy(d)}</b> \u2014 saved: ${S.idx[d].a} agents \u00b7 new file: ${Object.keys(ag[d]).length} agents`).join('<br>')}</p><p>Replace the saved data with this file, or cancel?</p><div class="bar" style="margin:0"><button class="b p" id="mr">Replace</button><button class="b" id="mc">Cancel</button></div></div>`;
  document.body.appendChild(m);$('#mr').onclick=()=>{m.remove();apply(ds)};$('#mc').onclick=()=>{m.remove();WANT=null;apply(ds.filter(d=>!dup.includes(d)))}}
async function logA(a,d){const r={t:Date.now(),a,d};if(DB){try{await DB.collection('log').add(Object.assign({u:ME,n:MEN},r))}catch(e){}}else{S.log=(S.log||[]).concat([r]).slice(-500);save()}}
async function delDay(d){const p=(S.idx[d]||{}).p||1;delete S.days[d];delete S.idx[d];
  if(DB){for(let i=0;i<p;i++)try{await DB.doc('days/'+d+'_'+i).delete()}catch(e){}}
  await saveIdx();logA('Delete day',dmy(d));render()}

const rawEv=(dt,name)=>((S.days[dt]&&S.days[dt][name])||[]).slice().sort((a,b)=>a[0]-b[0]);
const isOpen=(dt,name)=>{const e=rawEv(dt,name);return e.length>0&&e[e.length-1][1]!=='O'};
const tailLen=(dt,name)=>{const e=rawEv(dt,name),i=e.findIndex(x=>x[1]==='O');return i<0?e.length:i+1};
function getEvents(dt,name){
  let evs=rawEv(dt,name);
  if(isOpen(addDays(dt,-1),name))evs=evs.slice(tailLen(dt,name));
  if(isOpen(dt,name)){const nx=addDays(dt,1),e=rawEv(nx,name);evs=evs.concat(e.slice(0,tailLen(nx,name)).map(x=>[x[0]+86400,x[1],x[2],x[3]]))}
  return evs}

function calc(dt,name){
  const ev=getEvents(dt,name);
  const li=ev.find(e=>e[1]==='I');const login=li?li[0]:(ev[0]?ev[0][0]:0);
  const auto=Math.round(login/3600)*3600;const sh=tosec(S.shifts[dt+'|'+name]);const shift=sh==null?auto:sh;
  const fr=li?ev.find(e=>e[1]==='R'&&e[0]>=login):null;
  const targetCheckTime = fr ? fr[0] : login;
  const late=targetCheckTime>0?Math.max(0,targetCheckTime-shift):0;
  const o={name,login,shift,hasLogin:!!li,auto:sh==null,first:targetCheckTime,late,lateV:late>LIM.grace,
    em:{n:0,s:0},brk:0,work:0,cna:0,out:null,recv:{},rt:[]};
  ev.forEach((e,i)=>{
    if(e[1]==='O'){if(li&&e[0]<login)return;const nx=ev.slice(i+1).find(x=>x[1]==='I');
      if(!nx){o.out=e[0];if(/emergency/i.test(e[2])){o.em.n++;}return}
      const g=nx[0]-e[0];if(g>LIM.emerg&&/emergency/i.test(e[2])){o.em.n++;o.em.s+=g}}
    else if(e[1]==='N'){if(/^break/i.test(e[2]))o.brk+=e[3];else if(/^work$/i.test(e[2]))o.work+=e[3];else if(/no answer/i.test(e[2])&&e[3]>LIM.cna)o.cna++}});
  rawEv(dt,name).forEach(e=>{if(e[1]==='V'){o.recv[e[3]]=(o.recv[e[3]]||0)+1;if(e[3]<3)o.rt.push(hms(e[0])+' ('+e[3]+'s)')}});
  o.brkV=o.brk>LIM.brk;o.workV=o.work>LIM.work;
  return o}

const ek=(d,n,t)=>d+'|'+n+'|'+t;
const exd=(d,n,t)=>exOn(S.ex[ek(d,n,t)]);
function viol(dt,o){
  const v=[];
  if(o.lateV)v.push({t:'late',l:'Late arrival',v:formatDuration(mn(o.late))});
  if(o.em.n)v.push({t:'emerg',l:'Emergency ×'+o.em.n,v:formatDuration(mn(o.em.s))});
  if(o.brkV)v.push({t:'brk',l:'Break overrun',v:formatDuration(mn(o.brk-LIM.brk))+' over'});
  if(o.workV)v.push({t:'work',l:'Work overrun',v:formatDuration(mn(o.work-LIM.work))+' over'});
  if(o.cna)v.push({t:'cna',l:'Call No Answer',v:o.cna+' call(s)'});
  return v}
const TY=[['late','Late'],['emerg','Emergency'],['brk','Break'],['work','Work'],['cna','Call No Answer']];

function cell(dt,o,t,bad,txt,cls){
  if(!bad)return`<td class="c ok">${txt}</td>`;
  const c=S.ex[ek(dt,o.name,t)],x=exOn(c),nt=c&&c.n;
  return`<td class="c ${x?'x':cls||'v'}" data-ex="${dt}|${o.name}|${t}"${nt?` title="${esc(nt)}"`:''}>${txt}${nt?' \ud83d\udcdd':''}</td>`}

function formatTimeOut(ts){
  if(ts==null)return'—';
  const sec=ts%86400, dayOffset=Math.floor(ts/86400), tStr=hms(sec);
  return dayOffset>0?tStr+' (+1d)':tStr;
}

function dash(){
  const q=(window.Q||'').toLowerCase();const names=Object.keys(S.days[date]||{}).sort().filter(n=>n.toLowerCase().includes(q));
  if(!names.length)return Object.keys(S.days[date]||{}).length?`<div class="card"><div class="empty">No agent matches your search.</div></div>`:`<div class="card"><div class="empty">No data for ${dmy(date||'—')}.<br><br><button class="b p" id="addday">+ Add data for this date</button><div class="tag" style="margin-top:8px">Choose the report file that contains ${dmy(date||'')}. Other dates are not affected.</div></div></div>`;
  const rs=names.map(n=>calc(date,n));let tv=0,ex=0;
  rs.forEach(o=>viol(date,o).forEach(v=>exd(date,o.name,v.t)?ex++:tv++));
  const ct=f=>rs.filter(o=>f(o)).length;
  const body=rs.map(o=>{
    return`<tr><td class="n">${o.name}</td>
    <td>${o.hasLogin?`<input class="t" type="time" data-sh="${o.name}" value="${hms(o.shift).slice(0,5)}">`:'<span class="tag">Prev. day</span>'}</td>

function monthly(){
  const ds=Object.keys(S.days).filter(d=>d.startsWith(month)).sort();
  if(!ds.length)return`<div class="card"><div class="empty">No data for this month.</div></div>`;
  const A={},allAgents=new Set(),dList={};
  ds.forEach(d=>Object.keys(S.days[d]).forEach(n=>{
    allAgents.add(n);
    const o=calc(d,n);
    viol(d,o).forEach(v=>{
      if(!exd(d,n,v.t)){
        A[n]=A[n]||{total:0,types:{late:0,brk:0,work:0,cna:0,emerg:0},rawTypes:{}};
        const count=(v.t==='cna'?o.cna:1);
        A[n].total+=count;
        A[n].rawTypes[v.t]=(A[n].rawTypes[v.t]||0)+count;
        A[n].types[v.l]=(A[n].types[v.l]||0)+count;
        dList[n]=dList[n]||[];
        dList[n].push({date:dmy(d),type:v.l,detail:v.v});
      }
    })
  }));
  
  const sortedAgents=Array.from(allAgents).map(n=>({
    name:n,
    total:(A[n]?A[n].total:0),
    types:A[n]?A[n].types:{},
    raw:A[n]?A[n].rawTypes:{}
  }));

  const top3Best=[...sortedAgents].sort((a,b)=>a.total-b.total||a.name.localeCompare(b.name)).slice(0,3);
  const top3Worst=[...sortedAgents].sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name)).slice(0,3);
  const alphaAgents=[...sortedAgents].sort((a,b)=>a.name.localeCompare(b.name));

  const bestHtml=top3Best.length?top3Best.map(a=>`⭐ <b>${esc(a.name)}</b> <span style="opacity:0.8">(${a.total})</span>`).join('<br>'):'<span class="tag">No agents</span>';
  const worstHtml=top3Worst.length?top3Worst.map(a=>`⚠️ <b>${esc(a.name)}</b> <span style="opacity:0.8">(${a.total})</span>`).join('<br>'):'<span class="tag">No agents</span>';

  const rows=alphaAgents.map(a=>{
    const renderCell=(val)=>val>0?`<span class="v-badge">${val}</span>`:`<span class="ok-badge">0</span>`;
    return `<tr>
      <td class="n">${esc(a.name)}</td>
      <td class="c">${renderCell(a.raw.late||0)}</td>
      <td class="c">${renderCell(a.raw.brk||0)}</td>
      <td class="c">${renderCell(a.raw.cna||0)}</td>
      <td class="c">${renderCell(a.raw.work||0)}</td>
      <td class="c">${renderCell(a.raw.emerg||0)}</td>
      <td class="c n">${a.total>0?`<span class="v-badge">${a.total}</span>`:`<span class="ok-badge">0</span>`}</td>
    </tr>`;
  }).join('');

  const selectedAgent=window.MONTH_SELECTED_AGENT||(alphaAgents[0]?alphaAgents[0].name:'');
  const agentLogs=(dList[selectedAgent]||[]);
  const detailRows=agentLogs.map(l=>`<tr><td style="padding:5px 8px">${l.date}</td><td style="padding:5px 8px">${l.type}</td><td style="padding:5px 8px">${l.detail}</td></tr>`).join('')||'<tr><td colspan=3 class="empty" style="padding:15px">No unexcused violations for this agent</td></tr>';

  const dropdownOpts=alphaAgents.map(a=>`<option value="${esc(a.name)}" ${a.name===selectedAgent?'selected':''}>${esc(a.name)}</option>`).join('');

  return`
  <div class="bar"><input type="month" id="mo" value="${month}"></div>
  <div class="top-grid">
    <div class="top-box best">
      <h3>⭐ Top 3 Best (Least Violations)</h3>
      <div style="font-size:12px;line-height:1.5">${bestHtml}</div>
    </div>
    <div class="top-box worst">
      <h3>⚠️ Top 3 Worst (Most Violations)</h3>
      <div style="font-size:12px;line-height:1.5">${worstHtml}</div>
    </div>
  </div>
  
  <h2>Monthly Summary (Unexcused Violations Only)</h2>
  <div class="card"><table><thead><tr><th>Employee</th><th class="c">Late</th><th class="c">Break Overrun</th><th class="c">CNA</th><th class="c">Work Overrun</th><th class="c">Emergency</th><th class="c">Total Real Violations</th></tr></thead><tbody>${rows}</tbody></table></div>
  
  <h2>🔍 Agent Daily Incident Lookup</h2>
  <div class="card pad" style="max-width:700px">
    <p class="hint" style="margin-bottom:8px">Select an agent to inspect the precise dates and times of their unexcused violations:</p>
    <div class="bar" style="margin-bottom:8px"><label style="font-weight:600;font-size:13px">Select Agent: <select id="agent-select" style="margin-left:6px;padding:4px 8px">${dropdownOpts}</select></label></div>
    <table style="font-size:12px"><thead><tr><th style="padding:6px 8px">Date</th><th style="padding:6px 8px">Violation Type</th><th style="padding:6px 8px">Detail</th></tr></thead><tbody>${detailRows}</tbody></table>
  </div>`;
}

const nv=o=>viol(date,o).filter(v=>!exd(date,o.name,v.t)).length;
const nvForDate=(dt,o)=>viol(dt,o).filter(v=>!exd(dt,o.name,v.t)).length;

const EC={navy:'FF0F1C3F',hd:'FF1E3A8A',pri:'FF1D4ED8',red:'FFFDE8E8',redt:'FFB91C1C',amb:'FFFFF4D6',ambt:'FF92400E',grn:'FFE3F6EA',grnt:'FF15803D',bd:'FFE1E6EF',wh:'FFFFFFFF',mut:'FF6B7791'};
const RH=['Agent Name','Shift Start','Login Time','First Active','Late Arrival','Emergency','Break Total','Work Total','Call No Ans','Logout Time','Received','Status'];
const RW=[26,12,12,12,13,15,13,13,12,16,11,12];
const EF=(o)=>Object.assign({name:'Segoe UI',size:10},o||{});
const fillOf=c=>({type:'pattern',pattern:'solid',fgColor:{argb:c},bgColor:{argb:c}});
const edge=()=>({style:'thin',color:{argb:EC.bd}});
const BORD=()=>({top:edge(),left:edge(),bottom:edge(),right:edge()});

function repRow(d,o){
  const f=(bad,t)=>bad?(exd(d,o.name,t)?2:1):0,n=nvForDate(d,o);
  return{d,vals:[o.name,o.hasLogin?hms(o.shift):'Prev. day',o.hasLogin?hms(o.login):'Prev. day',o.first!=null?hms(o.first):'\u2014',
    formatDuration(mn(o.late)),o.em.n?o.em.n+' / '+formatDuration(mn(o.em.s)):'0',
    formatDuration(mn(o.brk)),formatDuration(mn(o.work)),o.cna,formatTimeOut(o.out),rcnt(o),n?n+' open':'Clean'],
    fl:[f(o.lateV,'late'),f(o.em.n,'emerg'),f(o.brkV,'brk'),f(o.workV,'work'),f(o.cna,'cna')]}}

async function collectRows(dates){
  const ms=new Set();[addDays(dates[0],-1),...dates,addDays(dates[dates.length-1],1)].forEach(d=>ms.add(d.slice(0,7)));
  for(const m of ms)await loadMonth(m);
  const out=[];dates.forEach(d=>Object.keys(S.days[d]||{}).sort().forEach(n=>out.push(repRow(d,calc(d,n)))));
  return out}

function styleBody(cell,c,fl){
  cell.font=EF();cell.alignment={vertical:'middle',horizontal:c===1?'left':'center'};cell.border=BORD();
  if(c>=5&&c<=9){const v=fl[c-5];
    if(v===1){cell.fill=fillOf(EC.red);cell.font=EF({bold:true,color:{argb:EC.redt}})}
    else if(v===2){cell.fill=fillOf(EC.grn);cell.font=EF({color:{argb:EC.grnt},strike:true})}}
  if(c===12){const s=String(cell.value);cell.font=EF({bold:true,color:{argb:s==='Clean'?EC.grnt:EC.redt}});cell.fill=fillOf(s==='Clean'?EC.grn:EC.red)}}

function headStyle(ws,rowNo){const r=ws.getRow(rowNo);r.height=26;
  RH.forEach((h,i)=>{const c=r.getCell(i+1);c.value=h;c.font=EF({bold:true,color:{argb:EC.wh}});c.fill=fillOf(EC.hd);c.alignment={vertical:'middle',horizontal:'center',wrapText:true};c.border=BORD()})}

function titleBlock(ws,text){
  ws.mergeCells('A1:L1');const t=ws.getCell('A1');t.value=text;t.font=EF({size:14,bold:true,color:{argb:EC.wh}});t.fill=fillOf(EC.navy);t.alignment={vertical:'middle',horizontal:'left',indent:1};ws.getRow(1).height=32;
  RW.forEach((w,i)=>{ws.getColumn(i+1).width=w})}

function kpiCells(ws,vals){
  [['Agents',vals[0]],['Late arrivals',vals[1]],['Emergency',vals[2]],['Open violations',vals[3]]].forEach((k,i)=>{
    const l=ws.getCell(3,1+i*3),v=ws.getCell(3,2+i*3);
    l.value=k[0];l.font=EF({bold:true,color:{argb:EC.mut}});l.alignment={horizontal:'left'};
    v.value=k[1];v.font=EF({size:12,bold:true,color:{argb:EC.pri}});v.alignment={horizontal:'left'}});
  ws.getRow(3).height=22}

async function exportReport(dates,mode){
  const rows=await collectRows(dates);
  if(!rows.length)throw new Error(mode==='day'?'No data for '+dmy(dates[0]):'No data in this period');
  const wb=new ExcelJS.Workbook();wb.calcProperties={fullCalcOnLoad:true};
  const ws=wb.addWorksheet('Report',{views:[{state:'frozen',ySplit:5,showGridLines:false}]});
  titleBlock(ws,'PERFORMANCE CONTACT CENTER \u2014 '+(mode==='day'?'DAILY REPORT':'PERIOD REPORT'));
  const lab=ws.getCell('A2');lab.value='Report date:';lab.font=EF({size:11,bold:true,color:{argb:EC.pri}});
  const pick=ws.getCell('B2');pick.font=EF({size:11,bold:true,color:{argb:EC.wh}});pick.fill=fillOf(EC.pri);pick.alignment={horizontal:'center',vertical:'middle'};pick.numFmt='@';ws.getRow(2).height=24;
  headStyle(ws,5);
  if(mode==='day'){
    pick.value=dmy(dates[0]);
    const cnt=k=>rows.filter(r=>r.fl[k]===1).length;
    kpiCells(ws,[rows.length,cnt(0),cnt(1),rows.reduce((a,r)=>a+r.fl.filter(x=>x===1).length,0)]);
    rows.forEach((r,i)=>{const row=ws.getRow(6+i);row.height=20;r.vals.forEach((v,k)=>{const c=row.getCell(k+1);c.value=v;styleBody(c,k+1,r.fl)})});
  }else{
    const CAP=Math.max(2000,Math.ceil((rows.length+500)/500)*500),LAST=CAP+1,TOP=6,N=150;
    const rg=c=>'Data!$'+c+'$2:$'+c+'$'+LAST;
    const ls=wb.addWorksheet('Lists');ls.getColumn(1).numFmt='@';ls.getColumn(1).width=14;ls.getCell('A1').value='Dates';ls.getCell('A1').font=EF({bold:true});
    dates.forEach((d,i)=>{ls.getCell(i+2,1).value=dmy(d)});
    const ds=wb.addWorksheet('Data');
    const DH=['Date','Agent Name','Shift Start','Login Time','First Active','Late Arrival','Emergency','Break Total','Work Total','Call No Ans','Logout Time','Received','Status','Flag Late','Flag Emerg','Flag Break','Flag Work','Flag CNA','Match','Pos'];
    DH.forEach((h,i)=>{const c=ds.getCell(1,i+1);c.value=h;c.font=EF({bold:true,color:{argb:EC.wh}});c.fill=fillOf(i<13?EC.hd:EC.mut);c.alignment={horizontal:'center',vertical:'middle',wrapText:true}});
    ds.getColumn(1).numFmt='@';ds.getColumn(1).width=13;ds.getColumn(2).width=26;for(let i=3;i<=18;i++)ds.getColumn(i).width=13;
    ds.getColumn(19).hidden=true;ds.getColumn(20).hidden=true;ds.views=[{state:'frozen',ySplit:1}];
    rows.forEach((r,i)=>{const row=ds.getRow(2+i);row.getCell(1).value=dmy(r.d);r.vals.forEach((v,k)=>{row.getCell(2+k).value=v});r.fl.forEach((v,k)=>{row.getCell(14+k).value=v})});
    for(let r=2;r<=LAST;r++){
      const m='AND($A'+r+'<>"",TRIM($A'+r+')=TRIM(Report!$B$2))';
      ds.getCell(r,19).value={formula:'IF('+m+',1,0)+N(S'+(r-1)+')'};
      ds.getCell(r,20).value={formula:'IF('+m+',S'+r+',"")'}}
    const first=dates.includes(date)&&S.days[date]?date:(dates.find(d=>S.days[d])||dates[0]);
    pick.value=dmy(first);
    pick.dataValidation={type:'list',allowBlank:false,showErrorMessage:true,errorTitle:'Invalid date',error:'Choose a date from the list.',formulae:['Lists!$A$2:$A$'+(dates.length+1)]};
    const hint=ws.getCell('C2');hint.value='\u25c0 choose a date from the list \u2014 the table shows only that date';hint.font=EF({italic:true,color:{argb:EC.mut}});
    kpiCells(ws,[{formula:'COUNT('+rg('T')+')'},{formula:'SUMPRODUCT(--ISNUMBER('+rg('T')+'),--('+rg('N')+'=1))'},
      {formula:'SUMPRODUCT(--ISNUMBER('+rg('T')+'),--('+rg('O')+'=1))'},
      {formula:'SUMPRODUCT(--ISNUMBER('+rg('T')+'),('+rg('N')+'=1)+('+rg('O')+'=1)+('+rg('P')+'=1)+('+rg('Q')+'=1)+('+rg('R')+'=1))'}]);
    const nd=ws.getCell('A4');nd.value={formula:'IF(COUNT('+rg('T')+')=0,"No data for this date \u2014 add its rows in the Data sheet (see Guide).","")'};nd.font=EF({italic:true,bold:true,color:{argb:EC.redt}});
    ws.getColumn(14).hidden=true;
    for(let i=0;i<N;i++){const r=TOP+i,row=ws.getRow(r);row.height=20;
      row.getCell(14).value={formula:'IFERROR(MATCH(ROW()-'+(TOP-1)+','+rg('T')+',0),"")'};
      for(let c=1;c<=12;c++){const L=String.fromCharCode(65+c),ix='INDEX('+rg(L)+',$N'+r+')',cell=row.getCell(c);
        cell.value={formula:'IF($N'+r+'="","",IF('+ix+'="","",'+ix+'))'};
        cell.font=EF();cell.alignment={vertical:'middle',horizontal:c===1?'left':'center'};cell.border=BORD()}}
    const END=TOP+N-1,flag=(col)=>'INDEX('+rg(col)+',$N'+TOP+')';
    const cf=(ref,formula,fill,font)=>ws.addConditionalFormatting({ref,rules:[{type:'expression',formulae:[formula],style:{fill:{type:'pattern',pattern:'solid',bgColor:{argb:fill}},font}}]});
    ['N','O','P','Q','R'].forEach((fc,k)=>{const col=String.fromCharCode(69+k),ref=col+TOP+':'+col+END;
      cf(ref,'AND($N'+TOP+'<>"",'+flag(fc)+'=1)',EC.red,{bold:true,color:{argb:EC.redt}});
      cf(ref,'AND($N'+TOP+'<>"",'+flag(fc)+'=2)',EC.grn,{strike:true,color:{argb:EC.grnt}})});
    cf('L'+TOP+':L'+END,'L'+TOP+'="Clean"',EC.grn,{bold:true,color:{argb:EC.grnt}});
    cf('L'+TOP+':L'+END,'AND(L'+TOP+'<>"",L'+TOP+'<>"Clean")',EC.red,{bold:true,color:{argb:EC.redt}});
    const gs=wb.addWorksheet('Guide');gs.getColumn(1).width=120;
    ['How to use this workbook',
     '1. On the Report sheet pick a date in cell B2 (dropdown). The table shows only that date and replaces the previous one.',
     '2. The dropdown lists every day of the period. A day with no data shows a red message under the title.',
     '3. To add a missing date: open the Data sheet and type its rows under the last row, columns A to M. Nothing else needs to change.',
     '4. Column A must be the date as text exactly like the dropdown (dd/mm/yyyy), for example 15/10/2026. The column is already formatted as Text.',
     '5. Optional: type 1 (violation) or 2 (excused) in the Flag columns N to R to colour the matching cell red or green.',
     '6. Do not edit the hidden helper columns S and T, or the formulas on the Report sheet.',
     'Colours: red = violation, green with strikethrough = excused by management.',
     'Capacity: '+(CAP-1)+' data rows and 150 agents per date.'].forEach((t,i)=>{const c=gs.getCell(i+1,1);c.value=t;c.font=EF({bold:i===0,size:i===0?13:10});c.alignment={wrapText:true,vertical:'top'}});
  }
  const buf=await wb.xlsx.writeBuffer();
  const url=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  const a=document.createElement('a');a.href=url;a.download=mode==='day'?'Performance_Report_'+dates[0]+'.xlsx':'Performance_Report_'+dates[0]+'_to_'+dates[dates.length-1]+'.xlsx';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}

function render(){
  let navItems=[['dash','Dashboard'],['mon','Monthly Report'],['data','Data'],['log','Audit Log']];
  if(USER_ROLE==='admin')navItems.push(['admin','Admin Panel']);
  $('#nav').innerHTML=navItems.map(t=>`<button class="${tab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('');
  const ds=Object.keys(S.idx).sort();if(!date)date=ds[ds.length-1]||new Date().toISOString().slice(0,10);if(tab!=='mon'||!month)month=date.slice(0,7);
  const lm=tab==='mon'?month:date.slice(0,7);if(DB&&!LOADED[lm]&&(tab==='dash'||tab==='mon')){$('#app').innerHTML='Loading…';Promise.all(adj(lm).map(loadMonth)).then(render);return}
  if(tab==='log'&&LOGS===null){(async()=>{if(DB){try{const q=await DB.collection('log').orderBy('t','desc').limit(200).get();LOGS=q.docs.map(x=>x.data())}catch(e){LOGS=[]}}else LOGS=[];render()})();return}
  const bar=tab==='dash'?`<div class="bar"><button class="b" data-step="-1">◀</button><input type="date" id="dt" value="${date}"><button class="b" data-step="1">▶</button><input id="q" placeholder="Search..." value="${window.Q||''}"><button class="b p" data-exp="1" style="margin-left:auto">⬇ Download report</button></div>`:tab==='mon'?`<div class="bar"><input type="month" id="mo" value="${month}"></div>`:'';
  $('#app').innerHTML=bar+({dash,mon:monthly,data,log:logv,admin:adminPanel}[tab])();
}

document.addEventListener('click',e=>{const t=e.target;let x;
  if(x=t.closest('[data-tab]')){tab=x.dataset.tab;LOGS=null;render()}
  else if(x=t.closest('[data-ex]')){openNote(x.dataset.ex)}
  else if(x=t.closest('[data-step]')){const d=new Date(date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+ +x.dataset.step);date=d.toISOString().slice(0,10);render()}
  else if(x=t.closest('[data-del]')){if(confirm('Delete?'))delDay(x.dataset.del)}
  else if(t.id==='nu-btn'){
    (async()=>{
      const em=$('#nu-em').value.trim(), pw=$('#nu-pw').value, role=$('#nu-role').value;
      if(!em||!pw){alert('Enter email and password');return}
      try{
        const secApp=firebase.initializeApp(FB_CONFIG,"SecAppCreate");
        const cred=await secApp.auth().createUserWithEmailAndPassword(em,pw);
        await DB.doc('users/'+cred.user.uid).set({email:em,active:true,role:role,created:Date.now(),by:MEN});
        await secApp.delete();logA('Create user',em+' · '+role);
        $('#nu-msg').textContent='User created successfully!';
        $('#nu-em').value=''; $('#nu-pw').value='';
      }catch(err){alert('Error: '+err.message)}
    })();
  }
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='dt'&&t.value){date=t.value;month=date.slice(0,7);render()}
  else if(t.id==='mo'&&t.value){month=t.value;render()}
  else if(t.id==='f'&&t.files[0])importFile(t.files[0]);
  else if(t.dataset.sh){const k=date+'|'+t.dataset.sh;S.shifts[k]=t.value;persistMap('sh',k);logA('Shift start',dmy(date)+' · '+t.dataset.sh+' = '+t.value);render()}
  else if(t.id==='agent-select'){window.MONTH_SELECTED_AGENT=t.value;render()}
});
render();
document.addEventListener('click',e=>{if(e.target.closest('[data-exp]'))openExport();if(e.target.id==='th'){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0b1020';r.dataset.theme=d?'light':'dark'}});
document.addEventListener('input',e=>{if(e.target.id==='q'){window.Q=e.target.value;const p=e.target.selectionStart;render();const q=$('#q');if(q){q.focus();q.setSelectionRange(p,p)}}});
document.addEventListener('click',e=>{if(e.target.id==='so')firebase.auth().signOut()});
document.addEventListener('click',async e=>{const id=e.target.id;
  if(id==='xc'||id==='mdl'){const m=document.getElementById('mdl');if(m)m.remove();return}
  if(id==='nx1'){saveNote(true);return}
  if(id==='nx0'||id==='nxs'){saveNote(false);return}
  if(id==='addday'){WANT=date;pickFile();return}
  if(id==='x1'||id==='x2'){const msg=$('#xm'),btn=e.target;btn.disabled=true;msg.textContent='Preparing\u2026';
    try{let dates;
      if(id==='x1')dates=[date];
      else{const f=$('#xf').value,t=$('#xt').value;if(!f||!t||f>t)throw new Error('choose a valid period');
        dates=[];for(let d=f;d<=t&&dates.length<=366;d=addDays(d,1))dates.push(d);if(dates.length>366)throw new Error('maximum period is 366 days')}
      await exportReport(dates,id==='x1'?'day':'period');msg.textContent='Done \u2713'}
    catch(err){msg.textContent='Failed: '+err.message}
    btn.disabled=false}});

boot();
</script></body></html>
