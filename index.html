<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Performance Contact Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f9;--card:#fff;--tx:#14213d;--mut:#6b7791;--bd:#e1e6ef;--pri:#1d4ed8;--red:#fde8e8;--redt:#b91c1c;--amb:#fff4d6;--ambt:#92400e;--grn:#e3f6ea;--grnt:#15803d;--hd:#0f1c3f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#141b30;--tx:#e8edf8;--mut:#8f9bb8;--bd:#25304d;--pri:#6d9bff;--red:#4a1d24;--redt:#ff9a9a;--amb:#4a3912;--ambt:#ffd27a;--grn:#12372a;--grnt:#6ee7a0;--hd:#070b17}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#141b30;--tx:#e8edf8;--mut:#8f9bb8;--bd:#25304d;--pri:#6d9bff;--red:#4a1d24;--redt:#ff9a9a;--amb:#4a3912;--ambt:#ffd27a;--grn:#12372a;--grnt:#6ee7a0;--hd:#070b17}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
header{background:var(--hd);color:#fff;padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0;letter-spacing:.3px}header small{opacity:.65;display:block;font-weight:400}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:transparent;border:0;color:#cbd5ee;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
nav button.on{background:#1d4ed8;color:#fff}
main{max-width:1500px;margin:0 auto;padding:20px 24px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
input,select,button.b{font:inherit;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
button.b{cursor:pointer;font-weight:600}button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}.k b{font-size:24px;display:block}.k span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow-x:auto;margin-bottom:16px}
table{border-collapse:collapse;width:100%;min-width:980px}th{background:var(--bg);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);padding:10px;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--bd);white-space:nowrap}td.n{font-weight:600}
.v{background:var(--red);color:var(--redt);font-weight:700;cursor:pointer;border-radius:6px}.w{background:var(--amb);color:var(--ambt);font-weight:700;cursor:pointer}
.ok{color:var(--grnt)}.x{background:var(--grn);color:var(--grnt);text-decoration:line-through;cursor:pointer}
td.c{text-align:center}.hint{color:var(--mut);font-size:12px;margin:0 0 12px}.empty{padding:40px;text-align:center;color:var(--mut)}
input.t{width:92px}h2{font-size:15px;margin:18px 0 8px}.tag{font-size:11px;color:var(--mut)}
@media print{header,.bar,.hint{display:none}}
header{background:linear-gradient(120deg,#0b1736,#1e3a8a);box-shadow:0 2px 12px rgba(0,0,0,.25)}.k{border-top:3px solid var(--pri);box-shadow:0 1px 3px rgba(20,33,61,.06)}.k b{font-size:28px}th{position:sticky;top:0;z-index:1}td.n{position:sticky;left:0;background:var(--card)}tbody tr:hover td:not(.v):not(.x):not(.w):not(.n){background:rgba(29,78,216,.06)}.chip{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}.chip.bad{background:var(--red);color:var(--redt)}.chip.good{background:var(--grn);color:var(--grnt)}.card.pad{padding:12px 18px}
.top-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:14px}
.top-box{border-radius:10px;padding:10px 14px;border:1px solid var(--bd)}
.top-box.best{background:var(--grn);border-color:#bbf7d0;color:var(--grnt)}
.top-box.worst{background:var(--red);border-color:#fecaca;color:var(--redt)}
.top-box h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.4px}
.v-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-weight:700;background:var(--red);color:var(--redt)}
.ok-badge{color:var(--grnt);font-weight:600}
table.dt{min-width:0}table.dt th,table.dt td{padding:8px 7px}table.dt th{white-space:normal;line-height:1.2;vertical-align:bottom}
.tp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:14px}
.tp-card{background:var(--card);border:1px solid var(--bd);border-top:3px solid;border-radius:11px;padding:10px 12px;box-shadow:0 1px 4px rgba(20,33,61,.045)}
.tp-card.best{border-top-color:#16a34a}.tp-card.worst{border-top-color:#dc2626}
.tp-hd{display:flex;gap:8px;align-items:center;margin-bottom:5px}.tp-hd span{font-size:19px}.tp-hd b{display:block;font-size:13px}.tp-hd small{color:var(--mut);font-size:10px}
.tp-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--bd)}
.tp-rank{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:var(--bg);flex:none}
.tp-rank.worst{background:var(--red);color:var(--redt)}
.tp-main{flex:1;min-width:0}.tp-nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tp-sub{font-size:10px;color:var(--mut);margin:1px 0 4px}
.tp-bar{height:6px;border-radius:99px;background:var(--bg);overflow:hidden}.tp-bar i{display:block;height:100%;border-radius:99px}.tp-bar i.best{background:#16a34a}.tp-bar i.worst{background:#dc2626}
.tp-cnt{font-size:19px;font-weight:800;min-width:28px;text-align:right}.tp-cnt.best{color:var(--grnt)}.tp-cnt.worst{color:var(--redt)}
.received-high{background:#ffedd5;color:#c2410c;font-weight:800;border-radius:6px;box-shadow:inset 0 0 0 1px #fdba74;padding:4px 8px!important}.tp-card.best{background:linear-gradient(145deg,var(--card),rgba(22,163,74,.045))}.tp-card.worst{background:linear-gradient(145deg,var(--card),rgba(220,38,38,.045))}@media(max-width:600px){.tp-grid{grid-template-columns:1fr}.tp-card{padding:9px 11px}.tp-row{gap:7px;padding:6px 0}.tp-cnt{font-size:17px}}
.ib{border:0;background:var(--bg);border-radius:6px;padding:3px 6px;cursor:pointer;font-size:12px;margin-right:3px;line-height:1}.ib:hover{background:var(--bd)}
.lkc{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:4px 12px;font:600 12px Inter,'Segoe UI',system-ui,sans-serif;cursor:pointer}.lkc.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.lg-day{font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 4px;display:flex;gap:8px;align-items:center}.lg-day:after{content:'';flex:1;height:1px;background:var(--bd)}
.lg-row{display:grid;grid-template-columns:52px 170px 1fr 150px;gap:10px;align-items:start;padding:7px 4px;border-bottom:1px solid var(--bd);font-size:13px}.lg-row:last-child{border-bottom:0}
.lg-t{color:var(--mut);font-variant-numeric:tabular-nums}.lg-d{word-break:break-word}
.lg-b{display:inline-block;justify-self:start;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:var(--bg);color:var(--mut)}
.lg-b.imp{background:#dbeafe;color:#1d4ed8}.lg-b.exc{background:var(--grn);color:var(--grnt)}.lg-b.man{background:#ede9fe;color:#6d28d9}.lg-b.del{background:var(--red);color:var(--redt)}.lg-b.set{background:var(--amb);color:var(--ambt)}.lg-b.usr{background:#e0f2fe;color:#0369a1}
.lg-u{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.lg-u i{font-style:normal;flex:none;width:20px;height:20px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
@media(max-width:760px){.lg-row{grid-template-columns:48px 1fr}.lg-row .lg-d,.lg-row .lg-u{grid-column:2}}
</style></head><body>
<header><h1>Performance Contact Center<small>Agent attendance &amp; conduct monitoring</small></h1>
<nav id="nav"></nav><span id="st" style="font-size:12px;color:#cbd5ee"></span><button class="b" id="so">Sign out</button><button class="b" id="th">◐ Theme</button></header>
<main id="app"></main>
<script>
const LIM={grace:300,emerg:180,brk:43*60,work:300,cna:6,shift:8*3600,appt:120,lastBrk:900,lastWork:300,recv:8};
let S={days:{},idx:{},shifts:{},ex:{},man:{},cfg:{exempt:['Dari Alshammari','Hatem Rashed','Walid Ibrahim','Abdulaziz Jasem','Hawara Abbas']}},tab='dash',date='',month='';const FB_CONFIG={apiKey:"AIzaSyC5wAmajiFgKEAfi4Ay0ZA1QGL-KS4K9zo",authDomain:"performance-control-ab7f9.firebaseapp.com",projectId:"performance-control-ab7f9",storageBucket:"performance-control-ab7f9.firebasestorage.app",messagingSenderId:"599359001764",appId:"1:599359001764:web:8ae96947247d8036b60231"};
let MEN='',DB=null,ME=null,LOADED={},LOGS=null,USER_ROLE='editor';
try{const r=localStorage.getItem('pcc_v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{if(DB)return;try{localStorage.setItem('pcc_v1',JSON.stringify(S))}catch(e){}};
const $=q=>document.querySelector(q);
const pad=n=>String(n).padStart(2,'0');
const hms=s=>pad(Math.floor(s/3600)%24)+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60);
const dmy=d=>d.split('-').reverse().join('/');
const mn=s=>Math.floor(s/60);
const formatDuration=(mTotal)=>{
  if(!mTotal||mTotal<=0)return'0 min';
  const h=Math.floor(mTotal/60), m=mTotal%60;
  if(h>0) return h+':'+pad(m)+' min';
  return m+' min';
};
const tosec=h=>{const m=/^(\d+):(\d+)/.exec(h||'');return m?m[1]*3600+m[2]*60:null};
const addDays=(dStr,n)=>{const d=new Date(dStr+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};

function pt(v){
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400)*1000);return[d.toISOString().slice(0,10),d.getUTCHours()*3600+d.getUTCMinutes()*60+d.getUTCSeconds()]}
  const m=/(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+):(\d+)\s*(AM|PM)?/i.exec(String(v));if(!m)return null;
  let y=+m[3];if(y<100)y+=2000;let h=+m[4]%12;if(/pm/i.test(m[7]||''))h+=12;if(!m[7])h=+m[4];
  return[y+'-'+pad(m[1])+'-'+pad(m[2]),h*3600+m[5]*60+ +m[6]]}
function pd(v){if(typeof v==='number')return Math.round(v*86400);const m=/(\d+):(\d+):(\d+)/.exec(String(v));return m?m[1]*3600+m[2]*60+ +m[3]:0}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function saveDay(d){
  if(!DB){save();return}
  const ag=S.days[d],parts=[];let cur={},sz=0;
  Object.keys(ag).forEach(n=>{const l=JSON.stringify(ag[n]).length;if(sz+l>200000&&Object.keys(cur).length){parts.push(cur);cur={};sz=0}cur[n]=ag[n];sz+=l});parts.push(cur);
  const old=(S.idx[d]&&S.idx[d].p)||0;
  for(let i=0;i<parts.length;i++)await DB.doc('days/'+d+'_'+i).set({date:d,month:d.slice(0,7),agents:JSON.stringify(parts[i])});
  for(let i=parts.length;i<old;i++)try{await DB.doc('days/'+d+'_'+i).delete()}catch(e){}
  S.idx[d].p=parts.length}
async function saveIdx(){if(!DB){save();return}await DB.doc('meta/index').set({dates:S.idx})}
function persistMap(c,k){if(!DB){save();return}const m=k.slice(0,7),src=c==='ex'?S.ex:c==='mn'?S.man:S.shifts,sub={};
  Object.keys(src).filter(x=>x.startsWith(m)).forEach(x=>sub[x]=src[x]);DB.doc((c==='mn'?'meta/mn_':c+'/')+m).set({m:sub}).catch(()=>{})}
function saveCfg(){if(DB){DB.doc('meta/settings').set({cfg:S.cfg}).catch(()=>{})}else save()}
async function loadMonth(m){if(!DB||LOADED[m])return;
  try{const q=await DB.collection('days').where('month','==',m).get();q.docs.forEach(x=>{const v=x.data();S.days[v.date]=Object.assign(S.days[v.date]||{},typeof v.agents==='string'?JSON.parse(v.agents):v.agents)});
    for(const c of ['ex','sh','mn']){const g=await DB.doc(c==='mn'?'meta/mn_'+m:c+'/'+m).get();if(g.exists)Object.assign(c==='ex'?S.ex:c==='mn'?S.man:S.shifts,g.data().m||{})}}catch(e){}
  LOADED[m]=1}

function showLogin(msg){let m=document.getElementById('lg');if(!m){m=document.createElement('div');m.id='lg';m.style.cssText='position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px';
  m.innerHTML=`<div class="card" style="padding:28px;width:min(400px,100%);overflow:visible;margin:0"><h2 style="margin-top:0;font-size:20px">Performance Contact Center</h2><p class="hint">Sign in to continue</p><div style="display:grid;gap:10px"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="b p" id="si">Sign in</button><span id="le" style="color:var(--redt);font-size:12px"></span></div></div>`;
  document.body.appendChild(m);
  const go=async()=>{$('#le').textContent='';try{await firebase.auth().signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value)}catch(e){$('#le').textContent='Sign-in failed: '+(e.code||e.message)}};
  $('#si').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()}}
  if(msg)$('#le').textContent=msg}
function hideLogin(){const m=document.getElementById('lg');if(m)m.remove()}

async function boot(){
  if(!window.firebase){showLogin('Firebase error.');return}
  firebase.initializeApp(FB_CONFIG);const auth=firebase.auth();
  auth.onAuthStateChanged(async u=>{
    if(!u){DB=null;$('#app').innerHTML='';showLogin();return}
    hideLogin();DB=firebase.firestore();ME=u.uid;MEN=u.email||'';
    try{
      const uDoc=await DB.doc('users/'+ME).get();
      if(uDoc.exists)USER_ROLE=uDoc.data().role||'editor';
      const g=await DB.doc('meta/index').get();S.idx=g.exists?(g.data().dates||{}):{};
      const gs=await DB.doc('meta/settings').get();if(gs.exists&&gs.data().cfg)S.cfg=gs.data().cfg;else saveCfg();
    }catch(e){}
    S.days={};S.ex={};S.shifts={};S.man={};LOADED={};date='';month='';
    $('#st').textContent='\u25cf '+MEN;render()})}

function importFile(f){
  const rd=new FileReader();rd.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true});
    const hi=rows.findIndex(r=>String(r[0]||'').trim()==='Agent Name');if(hi<0){alert('Header not found');return}
    const ag={},seenR={};
    rows.slice(hi+1).forEach(r=>{
      if(!r[0]||!r[3])return;const t=pt(r[3]);if(!t)return;
      const name=String(r[0]).trim(),st=String(r[4]||'').trim(),re=String(r[5]||'').trim(),d=pd(r[6]);
      const k=t[0]+'|'+name;let ev=null;
      if(/^logged-in/i.test(st)){ev=[t[1],'I','',0];seenR[k]=0}
      else if(/^logout/i.test(st))ev=[t[1],'O',re,0];
      else if(/^ready/i.test(st)){if(!seenR[k]){seenR[k]=1;ev=[t[1],'R','',0]}}
      else if(/^not ready/i.test(st)&&/^(break|work)$|no answer|appointment/i.test(re))ev=[t[1],'N',re,d];
      else if(/^(reserved|receiv)/i.test(st)&&d<=10)ev=[t[1],'V','',d];
      if(!ev)return;(ag[t[0]]=ag[t[0]]||{});(ag[t[0]][name]=ag[t[0]][name]||[]).push(ev)});
    const ds=Object.keys(ag);if(!ds.length){alert('No valid rows');return}
    ds.sort();
    if(WANT&&!ds.includes(WANT)){alert('This file has no data for '+dmy(WANT)+'.\nIt contains: '+ds.map(dmy).join(', ')+'.\nNothing was imported.');WANT=null;return}
    const dup=ds.filter(d=>S.idx[d]);
    const apply=async(keep,mode)=>{for(const d of keep){
        let data=ag[d],tag='Import';const had=S.idx[d];
        if(mode==='merge'&&had){await loadMonth(d.slice(0,7));const old=S.days[d]||{},add=Object.keys(ag[d]).filter(n=>!old[n]);if(!add.length)continue;data=Object.assign({},ag[d],old);tag='Import (new agents only, +'+add.length+')'}
        S.days[d]=data;S.idx[d]={a:Object.keys(data).length,t:Date.now(),f:(mode==='merge'&&had?(had.f?had.f+' + ':'')+(f.name||'file'):f.name||''),p:had?had.p||0:0};
        await saveDay(d);logA(tag,dmy(d)+' \u00b7 '+(f.name||'file')+' \u00b7 '+S.idx[d].a+' agents')}
      if(keep.length){await saveIdx();date=(WANT&&keep.includes(WANT))?WANT:keep[keep.length-1];month=date.slice(0,7);tab='dash'}WANT=null;render()};
    if(dup.length)ask(dup,ag,apply,ds);else apply(ds,'replace');
  };rd.readAsArrayBuffer(f)}

let WANT=null;
const exOn=v=>v===1||!!(v&&v.e===1);
const VN={late:'Late arrival',emerg:'Emergency',brk:'Break overrun',work:'Work overrun',cna:'Call No Answer',appt:'Appointment confirmation >2 min',lbrk:'Break in last 15 min',lwork:'Work in last 5 min',recv:'Received over 8 (1–2 sec)'};
function openNote(k){
  const [d,n,t]=k.split('|'),cur=S.ex[k],on=exOn(cur),note=(cur&&cur.n)||'';
  const m=document.createElement('div');m.id='mdl';m.dataset.k=k;m.style.cssText=MS;
  m.innerHTML=`<div class="card" style="padding:22px;width:min(480px,100%);overflow:visible;margin:0"><h2 style="margin-top:0;font-size:18px">${esc(n)}</h2>
  <p class="hint" style="margin:0 0 12px">${dmy(d)} \u00b7 ${VN[t]||t} \u00b7 ${on?'<span class="chip good">Excused</span>':'<span class="chip bad">Open violation</span>'}</p>
  <label class="tag">Note \u2014 what the employee told you, who approved, etc.</label>
  <textarea id="nt" rows="4" style="width:100%;margin:6px 0 12px;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)">${esc(note)}</textarea>
  <div class="bar" style="margin:0"><button class="b p" id="nx1">${on?'Save note':'Excuse &amp; save note'}</button>${on?'<button class="b" id="nx0">Remove excuse</button>':'<button class="b" id="nxs">Save note only</button>'}<button class="b" id="xc" style="margin-left:auto">Cancel</button></div>
  ${cur&&cur.by?`<p class="tag" style="margin:10px 0 0">Last edit: ${esc(cur.by)} \u00b7 ${new Date(cur.t).toLocaleString()}</p>`:''}</div>`;
  document.body.appendChild(m)}
function saveNote(excused){const m=document.getElementById('mdl');if(!m)return;const k=m.dataset.k,note=($('#nt').value||'').trim(),was=exOn(S.ex[k]);
  if(!excused&&!note)delete S.ex[k];else S.ex[k]={e:excused?1:0,n:note,by:MEN,t:Date.now()};
  persistMap('ex',k);logA(excused?(was?'Excused (note updated)':'Excuse'):(note?'Note':'Restore violation'),k.split('|').reverse().join(' \u00b7 ')+(note?' \u2014 '+note:''));
  m.remove();render()}
const rcnt=o=>(o.recv[1]||0)+(o.recv[2]||0);
const MS='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px';
const adj=m=>{const y=+m.slice(0,4),k=+m.slice(5),f=(a,b)=>a+'-'+pad(b);return[m,k===1?f(y-1,12):f(y,k-1),k===12?f(y+1,1):f(y,k+1)]};
function pickFile(){const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls';i.onchange=()=>{if(i.files[0])importFile(i.files[0])};i.click()}
async function ask(dup,ag,apply,ds){
  await Promise.all(dup.map(d=>loadMonth(d.slice(0,7))));
  const info=dup.map(d=>{const old=S.days[d]||{};return{d,saved:S.idx[d].a,inFile:Object.keys(ag[d]).length,add:Object.keys(ag[d]).filter(n=>!old[n])}});
  const nNew=info.reduce((a,x)=>a+x.add.length,0);
  const m=document.createElement('div');m.id='mdl';m.style.cssText=MS;
  m.innerHTML=`<div class="card" style="padding:22px;max-width:500px;overflow:visible;margin:0"><h2 style="margin-top:0">This date already has data</h2>
  <p>${info.map(x=>`<b>${dmy(x.d)}</b> \u2014 saved ${x.saved} agents \u00b7 file ${x.inFile} \u00b7 <b>${x.add.length} new</b>${x.add.length?` <span class="tag">(${x.add.slice(0,4).map(esc).join(', ')}${x.add.length>4?'\u2026':''})</span>`:''}`).join('<br>')}</p>
  <div class="bar" style="margin:0"><button class="b p" id="ma" ${nNew?'':'disabled'}>Add new agents only${nNew?' ('+nNew+')':''}</button><button class="b" id="mr">Replace all</button><button class="b" id="mc">Cancel</button></div>
  <p class="tag" style="margin:10px 0 0">\u201cAdd new agents only\u201d keeps what is already saved and adds just the agents missing for this date. \u201cReplace all\u201d overwrites the date with this file.</p></div>`;
  document.body.appendChild(m);
  $('#ma').onclick=()=>{m.remove();apply(ds,'merge')};
  $('#mr').onclick=()=>{m.remove();apply(ds,'replace')};
  $('#mc').onclick=()=>{m.remove();WANT=null;apply(ds.filter(d=>!dup.includes(d)),'replace')}}
async function logA(a,d){const r={t:Date.now(),a,d};if(DB){try{await DB.collection('log').add(Object.assign({u:ME,n:MEN},r))}catch(e){}}else{S.log=(S.log||[]).concat([r]).slice(-500);save()}}
async function delDay(d){const p=(S.idx[d]||{}).p||1;delete S.days[d];delete S.idx[d];
  if(DB){for(let i=0;i<p;i++)try{await DB.doc('days/'+d+'_'+i).delete()}catch(e){}}
  await saveIdx();logA('Delete day',dmy(d));render()}

const rawEv=(dt,name)=>((S.days[dt]&&S.days[dt][name])||[]).slice().sort((a,b)=>a[0]-b[0]);
const isOpen=(dt,name)=>{const e=rawEv(dt,name);return e.length>0&&e[e.length-1][1]!=='O'};
const tailLen=(dt,name)=>{const e=rawEv(dt,name),i=e.findIndex(x=>x[1]==='O');return i<0?e.length:i+1};
function getEvents(dt,name){
  let evs=rawEv(dt,name);
  if(isOpen(addDays(dt,-1),name))evs=evs.slice(tailLen(dt,name));
  if(isOpen(dt,name)){const nx=addDays(dt,1),e=rawEv(nx,name);evs=evs.concat(e.slice(0,tailLen(nx,name)).map(x=>[x[0]+86400,x[1],x[2],x[3]]))}
  return evs}

const nz=x=>String(x).toLowerCase().replace(/\s+/g,' ').trim();
const isExempt=name=>(S.cfg&&S.cfg.exempt||[]).some(x=>nz(x)===nz(name));
const agentsOf=d=>[...new Set([...Object.keys(S.days[d]||{}),...Object.keys(S.man).filter(k=>k.startsWith(d+'|')).map(k=>k.slice(11))])];
const daysIn=m=>[...new Set([...Object.keys(S.days),...Object.keys(S.man).map(k=>k.slice(0,10))])].filter(d=>d.startsWith(m)).sort();
function finish(o){const ex=isExempt(o.name);o.exempt=ex;
  o.brkV=o.brk>LIM.brk;o.workV=!ex&&o.work>LIM.work;o.emV=!ex&&o.em.n>0;
  o.apptV=!ex&&o.appt>0;o.lbrkV=o.lbrk.length>0;o.lworkV=!ex&&o.lwork.length>0;o.recvV=rcnt(o)>LIM.recv;return o}
function manualCalc(dt,name,m){
  const sh=tosec(S.shifts[dt+'|'+name]),shift=sh!=null?sh:(tosec(m.shift)||0),login=tosec(m.login),first=tosec(m.first);
  const ref=first!=null?first:login,late=ref!=null&&shift?Math.max(0,ref-shift):0;let out=tosec(m.out);if(out!=null&&m.outNext)out+=86400;
  return finish({name,login:login||0,shift,hasLogin:login!=null,auto:false,first:ref,late,lateV:late>LIM.grace,
    em:{n:m.emN||0,s:(m.emM||0)*60},brk:(m.brk||0)*60,work:(m.work||0)*60,cna:m.cna||0,out,recv:{1:m.recv||0},rt:[],
    appt:m.appt||0,apptT:[],emT:[],lbrk:m.lbrk?['manual']:[],lwork:m.lwork?['manual']:[],manual:true,note:m.note||''})}
function calc(dt,name){
  if(S.man[dt+'|'+name])return manualCalc(dt,name,S.man[dt+'|'+name]);
  const ev=getEvents(dt,name);
  const li=ev.find(e=>e[1]==='I');const login=li?li[0]:(ev[0]?ev[0][0]:0);
  const auto=Math.round(login/3600)*3600;const sh=tosec(S.shifts[dt+'|'+name]);const shift=sh==null?auto:sh;
  const fr=li?ev.find(e=>e[1]==='R'&&e[0]>=login):null;
  const targetCheckTime=li?(fr?fr[0]:login):null; // no login that day = shift started the previous day: no lateness
  const late=targetCheckTime!=null?Math.max(0,targetCheckTime-shift):0;
  const o={name,login,shift,hasLogin:!!li,auto:sh==null,first:targetCheckTime,late,lateV:late>LIM.grace,
    em:{n:0,s:0},brk:0,work:0,cna:0,out:null,recv:{},rt:[],appt:0,apptT:[],emT:[],lbrk:[],lwork:[]};
  ev.forEach((e,i)=>{
    if(e[1]==='O'){if(li&&e[0]<login)return;const nx=ev.slice(i+1).find(x=>x[1]==='I');
      if(!nx){o.out=e[0];if(/emergency/i.test(e[2])){o.em.n++;o.emT.push(hms(e[0])+' → no return today')}return}
      const g=nx[0]-e[0];if(g>LIM.emerg&&/emergency/i.test(e[2])){o.em.n++;o.em.s+=g;o.emT.push(hms(e[0])+' → '+hms(nx[0])+' ('+formatDuration(mn(g))+')')}}
    else if(e[1]==='N'){const endS=shift+LIM.shift;
      if(/^break/i.test(e[2])){o.brk+=e[3];if(li&&e[0]>=endS-LIM.lastBrk&&e[0]<=endS)o.lbrk.push(hms(e[0]))}
      else if(/^work$/i.test(e[2])){o.work+=e[3];if(li&&e[0]>=endS-LIM.lastWork&&e[0]<=endS)o.lwork.push(hms(e[0]))}
      else if(/no answer/i.test(e[2])&&e[3]>LIM.cna)o.cna++;
      else if(/appointment/i.test(e[2])&&e[3]>LIM.appt){o.appt++;o.apptT.push(hms(e[0])+' ('+formatDuration(mn(e[3]))+')')}}});
  rawEv(dt,name).forEach(e=>{if(e[1]==='V'){o.recv[e[3]]=(o.recv[e[3]]||0)+1;if(e[3]<3)o.rt.push(hms(e[0])+' ('+e[3]+'s)')}});
  return finish(o)}

const ek=(d,n,t)=>d+'|'+n+'|'+t;
const exd=(d,n,t)=>exOn(S.ex[ek(d,n,t)]);
function viol(dt,o){
  const v=[];
  if(o.lateV)v.push({t:'late',l:'Late arrival',v:formatDuration(mn(o.late))});
  if(o.emV)v.push({t:'emerg',l:'Emergency ×'+o.em.n,v:o.emT.length?o.emT.join(' · '):formatDuration(mn(o.em.s))});
  if(o.brkV)v.push({t:'brk',l:'Break overrun',v:formatDuration(mn(o.brk-LIM.brk))+' over'});
  if(o.workV)v.push({t:'work',l:'Work overrun',v:formatDuration(mn(o.work-LIM.work))+' over'});
  if(o.cna)v.push({t:'cna',l:'Call No Answer',v:o.cna+' call(s)'});
  if(o.apptV)v.push({t:'appt',l:'Appointment confirmation >2 min',v:o.apptT.length?o.apptT.join(', '):o.appt+' call(s)'});
  if(o.lbrkV)v.push({t:'lbrk',l:'Break in last 15 min',v:o.lbrk.join(', ')});
  if(o.lworkV)v.push({t:'lwork',l:'Work in last 5 min',v:o.lwork.join(', ')});
  if(o.recvV)v.push({t:'recv',l:'Received over '+LIM.recv+' (1–2 sec)',v:rcnt(o)+' calls'+(o.rt.length?': '+o.rt.join(', '):'')});
  return v}
const TY=[['late','Late'],['emerg','Emergency'],['brk','Break'],['work','Work'],['cna','Call No Answer'],['appt','Appointment'],['lbrk','Break last 15'],['lwork','Work last 5'],['recv','Received >8']];

const mcell=(txt,tip)=>`<td class="c" style="color:var(--mut)"${tip?` title="${esc(tip)}"`:''}>${txt}</td>`;
function cell(dt,o,t,bad,txt,cls,tip){
  if(!bad)return`<td class="c ok"${tip?` title="${esc(tip)}"`:''}>${txt}</td>`;
  const c=S.ex[ek(dt,o.name,t)],x=exOn(c),nt=c&&c.n,tt=nt||tip||'';
  return`<td class="c ${x?'x':cls||'v'}" data-ex="${dt}|${o.name}|${t}"${tt?` title="${esc(tt)}"`:''}>${txt}${nt?' 📝':''}</td>`}
const rchip=(dt,o,t,txt)=>{const c=S.ex[ek(dt,o.name,t)],x=exOn(c),nt=c&&c.n;return`<span class="chip ${x?'good':'bad'}" data-ex="${dt}|${o.name}|${t}" style="cursor:pointer;margin-right:4px;${x?'text-decoration:line-through':''}"${nt?` title="${esc(nt)}"`:''}>${txt}${nt?' 📝':''}</span>`};

function formatTimeOut(ts){
  if(ts==null)return'—';
  const sec=ts%86400, dayOffset=Math.floor(ts/86400), tStr=hms(sec);
  return dayOffset>0?tStr+' (+1d)':tStr;
}

function dash(){
  const q=(window.Q||'').toLowerCase();const names=agentsOf(date).sort().filter(n=>n.toLowerCase().includes(q));
  if(!names.length)return agentsOf(date).length?`<div class="card"><div class="empty">No agent matches your search.</div></div>`:`<div class="card"><div class="empty">No data for ${dmy(date||'—')}.<br><br><button class="b p" id="addday">+ Add data for this date</button><div class="tag" style="margin-top:8px">Choose the report file that contains ${dmy(date||'')}. Other dates are not affected.</div></div></div>`;
  const rs=names.map(n=>calc(date,n));let tv=0,ex=0;
  rs.forEach(o=>viol(date,o).forEach(v=>exd(date,o.name,v.t)?ex++:tv++));
  const ct=f=>rs.filter(o=>f(o)).length;
  const body=rs.map(o=>{
    return`<tr><td class="n">${esc(o.name)}${o.manual?` <span class="chip good" data-man="${esc(o.name)}" style="cursor:pointer" title="Manual entry – click to edit">manual</span>`:''}${o.exempt?` <span class="tag" title="Work, Emergency and Appointment are not counted">(exempt)</span>`:''}</td>
    <td class="c" style="white-space:nowrap">${USER_ROLE!=='viewer'?`<button class="ib" data-aedit="${esc(o.name)}" title="Edit this agent's data">✎</button><button class="ib" data-adel="${esc(o.name)}" title="Delete this agent's data for this date">🗑</button>`:''}</td>
    <td>${o.hasLogin?`<input class="t" type="time" data-sh="${o.name}" value="${hms(o.shift).slice(0,5)}">`:'<span class="tag">Prev. day</span>'}</td>
    <td>${o.hasLogin?hms(o.login):'Prev. day'}</td><td>${o.first!=null?hms(o.first):'—'}</td>
    ${cell(date,o,'late',o.lateV,formatDuration(mn(o.late)))}
    ${o.exempt?mcell(o.em.n?o.em.n+' / '+formatDuration(mn(o.em.s)):'—',o.em.n?'Emergency (exempt, not counted): '+o.emT.join(' · '):''):cell(date,o,'emerg',o.emV,o.em.n?o.em.n+' / '+formatDuration(mn(o.em.s)):'0','v',o.emT.join(' · '))}
    ${cell(date,o,'brk',o.brkV,formatDuration(mn(o.brk)))}
    ${o.exempt?mcell('—','Work '+formatDuration(mn(o.work))+' (exempt, not counted)'):cell(date,o,'work',o.workV,formatDuration(mn(o.work)))}
    ${cell(date,o,'cna',o.cna,o.cna)}
    ${o.exempt?mcell('—',o.appt?'Appointment confirmation >2 min ×'+o.appt+' (exempt, not counted): '+o.apptT.join(', '):''):cell(date,o,'appt',o.apptV,o.appt,'v',o.apptT.join(', '))}
    <td>${o.lbrkV?rchip(date,o,'lbrk','Break '+o.lbrk[0]):''}${o.lworkV?rchip(date,o,'lwork','Work '+o.lwork[0]):''}${o.lbrkV||o.lworkV?'':'<span class="tag">—</span>'}</td>
    <td>${formatTimeOut(o.out)}</td>${cell(date,o,'recv',o.recvV,rcnt(o),'received-high',o.rt.join(', '))}<td>${nv(o)?`<span class="chip bad">${nv(o)} open</span>`:'<span class="chip good">Clean</span>'}</td></tr>`}).join('');
  
  return`<div style="margin-bottom:12px;font-weight:700;font-size:15px;color:var(--pri)">📅 Report Date: ${dmy(date)}</div>
  <div class="kpis"><div class="k"><b>${names.length}</b><span>Agents</span></div>
  <div class="k"><b>${ct(o=>o.lateV)}</b><span>Late arrivals</span></div>
  <div class="k"><b>${ct(o=>o.emV)}</b><span>Emergency</span></div>
  <div class="k"><b>${ct(o=>o.brkV)}</b><span>Break overruns</span></div>
  <div class="k"><b>${tv}</b><span>Open violations</span></div><div class="k"><b>${ex}</b><span>Excused</span></div><div class="k"><b>${rs.reduce((a,o)=>a+rcnt(o),0)}</b><span>Received (1,2 sec)</span></div><div class="k"><b>${ct(o=>o.apptV)}</b><span>Appointment >2 min</span></div><div class="k"><b>${ct(o=>o.lbrkV||o.lworkV)}</b><span>Restricted time</span></div></div>
  <div class="card"><table class="dt"><thead><tr><th>Agent</th><th></th><th>Shift start</th><th>Login</th><th>First active</th><th>Late</th><th>Emergency (count/time)</th><th>Break total</th><th>Work total</th><th>Call no answer</th><th>Appt. confirm &gt;2 min</th><th title="Break in the last 15 min or Work in the last 5 min of the shift">Restricted time</th><th>Logout time</th><th class="c">Received</th><th>Status</th></tr></thead><tbody>${body}</tbody></table></div>`}

function monthly(){
  const ds=daysIn(month);
  if(!ds.length)return`<div class="card"><div class="empty">No data for this month.</div></div>`;
  const A={},allAgents=new Set(),dList={};
  ds.forEach(d=>agentsOf(d).forEach(n=>{
    allAgents.add(n);
    const o=calc(d,n);
    viol(d,o).forEach(v=>{
      if(!exd(d,n,v.t)){
        A[n]=A[n]||{total:0,types:{late:0,brk:0,work:0,cna:0,emerg:0},rawTypes:{}};
        const count=(v.t==='cna'?o.cna:v.t==='appt'?o.appt:1);
        A[n].total+=count;
        A[n].rawTypes[v.t]=(A[n].rawTypes[v.t]||0)+count;
        A[n].types[v.l]=(A[n].types[v.l]||0)+count;
        dList[n]=dList[n]||[];
        dList[n].push({date:dmy(d),type:v.l,detail:v.v,t:v.t});
      }
    })
  }));
  
  const sortedAgents=Array.from(allAgents).map(n=>({
    name:n,
    total:(A[n]?A[n].total:0),
    types:A[n]?A[n].types:{},
    raw:A[n]?A[n].rawTypes:{}
  }));

  const top3Best=[...sortedAgents].sort((a,b)=>a.total-b.total||a.name.localeCompare(b.name)).slice(0,3);
  const top3Worst=[...sortedAgents].sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name)).slice(0,3);
  const alphaAgents=[...sortedAgents].sort((a,b)=>a.name.localeCompare(b.name));

  const mxV=Math.max(1,...sortedAgents.map(a=>a.total));
  const TN={late:'Late',brk:'Break',work:'Work',cna:'CNA',emerg:'Emergency',appt:'Appt.',lbrk:'Break last 15',lwork:'Work last 5',recv:'Received >8'};
  const why=a=>Object.entries(a.raw).filter(x=>x[1]>0).sort((x,y)=>y[1]-x[1]).slice(0,2).map(x=>(TN[x[0]]||x[0])+' ×'+x[1]).join(' · ')||'No violations';
  const tRow=(a,i,k)=>`<div class="tp-row"><span class="tp-rank ${k}">${k==='best'?['🥇','🥈','🥉'][i]:i+1}</span><div class="tp-main"><div class="tp-nm">${esc(a.name)}</div><div class="tp-sub">${why(a)}</div><div class="tp-bar"><i class="${k}" style="width:${a.total?Math.max(6,a.total/mxV*100):0}%"></i></div></div><div class="tp-cnt ${k}">${a.total}</div></div>`;
  const tCard=(k,ico,ttl,sub,list)=>`<div class="tp-card ${k}"><div class="tp-hd"><span>${ico}</span><div><b>${ttl}</b><small>${sub}</small></div></div>${list.length?list.map((a,i)=>tRow(a,i,k)).join(''):'<div class="tag">No agents</div>'}</div>`;
  const topHtml=`<div class="tp-grid">${tCard('best','🏆','Top 3 · Best performers','Fewest unexcused violations this month',top3Best)}${tCard('worst','⚠️','Top 3 · Needs attention','Most unexcused violations this month',top3Worst)}</div>`;

  const rows=alphaAgents.map(a=>{
    const renderCell=(val)=>val>0?`<span class="v-badge">${val}</span>`:`<span class="ok-badge">0</span>`;
    return `<tr>
      <td class="n">${esc(a.name)}</td>
      <td class="c">${renderCell(a.raw.late||0)}</td>
      <td class="c">${renderCell(a.raw.brk||0)}</td>
      <td class="c">${renderCell(a.raw.cna||0)}</td>
      <td class="c">${renderCell(a.raw.work||0)}</td>
      <td class="c">${renderCell(a.raw.emerg||0)}</td>
      <td class="c">${renderCell(a.raw.appt||0)}</td>
      <td class="c">${renderCell((a.raw.lbrk||0)+(a.raw.lwork||0))}</td>
      <td class="c">${renderCell(a.raw.recv||0)}</td>
      <td class="c n">${a.total>0?`<span class="v-badge">${a.total}</span>`:`<span class="ok-badge">0</span>`}</td>
    </tr>`;
  }).join('');

  const selectedAgent=window.MONTH_SELECTED_AGENT||(alphaAgents[0]?alphaAgents[0].name:'');
  const agentLogs=(dList[selectedAgent]||[]);
  const sumT=(A[selectedAgent]?A[selectedAgent].rawTypes:{});
  const LT=(window.LK_T&&sumT[window.LK_T])?window.LK_T:'';
  const logsF=LT?agentLogs.filter(l=>l.t===LT):agentLogs;
  const chipsHtml=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px"><button class="lkc ${LT?'':'on'}" data-lt="">All · ${agentLogs.length}</button>${Object.entries(sumT).filter(x=>x[1]>0).map(x=>`<button class="lkc ${LT===x[0]?'on':''}" data-lt="${x[0]}">${TN[x[0]]||x[0]} ×${x[1]}</button>`).join('')}</div>`;
  const detailRows=agentLogs.filter(l=>!(window.LK_T&&sumT[window.LK_T])||l.t===window.LK_T).map(l=>`
    <tr style="transition:background 0.2s">
      <td style="padding:6px 12px;border-bottom:1px solid var(--bd);font-weight:500">${l.date}</td>
      <td style="padding:6px 12px;border-bottom:1px solid var(--bd);color:var(--pri);font-weight:600">${l.type}</td>
      <td style="padding:6px 12px;border-bottom:1px solid var(--bd);color:var(--mut);white-space:normal;word-break:break-word">${l.detail}</td>
    </tr>`).join('')||'<tr><td colspan=3 class="empty" style="padding:20px;text-align:center;color:var(--mut)">No unexcused violations for this agent</td></tr>';

  const dropdownOpts=alphaAgents.map(a=>`<option value="${esc(a.name)}" ${a.name===selectedAgent?'selected':''}>${esc(a.name)}</option>`).join('');

  return`
  <div class="bar"><input type="month" id="mo" value="${month}"></div>
  ${topHtml}
  
  <div style="margin:20px 0 8px;display:flex;align-items:center;justify-content:space-between;">
    <h2 style="font-size:15px;font-weight:700;color:var(--tx);margin:0;display:flex;align-items:center;gap:8px;">
      <span style="width:4px;height:16px;background:var(--pri);border-radius:2px;display:inline-block;"></span>
      Monthly Summary (Unexcused Violations Only)
    </h2>
  </div>
  
  <div class="card" style="border-radius:10px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,0.03);">
    <table style="width:100%;border-collapse:collapse;">
      <thead>
        <tr style="background:#0f1c3f;color:#ffffff;">
          <th style="padding:10px 14px;text-align:left;font-size:11px;letter-spacing:.4px;color:#ffffff;background:#0f1c3f;">EMPLOYEE</th>
          <th style="padding:10px 10px;text-align:center;font-size:11px;letter-spacing:.4px;color:#ffffff;background:#0f1c3f;">LATE</th>
          <th style="padding:10px 10px;text-align:center;font-size:11px;letter-spacing:.4px;color:#ffffff;background:#0f1c3f;">BREAK OVERRUN</th>
          <th style="padding:10px 10px;text-align:center;font-size:11px;letter-spacing:.4px;color:#ffffff;background:#0f1c3f;">CNA</th>
          <th style="padding:10px 10px;text-align:center;font-size:11px;letter-spacing:.4px;color:#ffffff;background:#0f1c3f;">WORK OVERRUN</th>
          <th style="padding:10px 10px;text-align:center;font-size:11px;letter-spacing:.4px;color:#ffffff;background:#0f1c3f;">EMERGENCY</th>
          <th style="padding:10px 10px;text-align:center;font-size:11px;letter-spacing:.4px;color:#ffffff;background:#0f1c3f;">APPOINTMENT</th>
          <th style="padding:10px 10px;text-align:center;font-size:11px;letter-spacing:.4px;color:#ffffff;background:#0f1c3f;">RESTRICTED TIME</th>
          <th style="padding:10px 10px;text-align:center;font-size:11px;letter-spacing:.4px;color:#ffffff;background:#0f1c3f;">RECEIVED &gt;8</th>
          <th style="padding:10px 14px;text-align:center;font-size:11px;letter-spacing:.4px;color:#ffffff;background:#0f1c3f;">TOTAL REAL VIOLATIONS</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>

const LGC=[['all','All'],['imp','Imports'],['exc','Excuses & notes'],['man','Manual data'],['del','Deletions'],['set','Settings'],['usr','Users']];

function logv(){

  const cnt=k=>k==='all'?all.length:all.filter(x=>x.c===k).length;
  const list=all.filter(x=>(C==='all'||x.c===C)&&(!Q||((x.n||'')+' '+x.a+' '+x.d).toLowerCase().includes(Q)));
  const shown=list.slice(0,N),day=t=>new Date(t).toLocaleDateString('en-CA'),today=day(Date.now()),yest=day(Date.now()-864e5);
  let last='',body='';
  shown.forEach(x=>{const dk=day(x.t);
    if(dk!==last){last=dk;const n=list.filter(y=>day(y.t)===dk).length;body+=`<div class="lg-day">${dk===today?'Today':dk===yest?'Yesterday':dmy(dk)}<span class="tag">${n}</span></div>`}
    const u=(x.n||'').split('@')[0]||'—';

  return`<div class="bar" style="margin-bottom:10px"><input id="lg-q" placeholder="Search the log…" value="${esc(window.LG_Q||'')}" style="min-width:240px"><span class="tag">${list.length} of ${all.length} entries</span></div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">${LGC.map(c=>`<button class="lkc ${C===c[0]?'on':''}" data-lc="${c[0]}">${c[1]} · ${cnt(c[0])}</button>`).join('')}</div>
  <div class="card" style="padding:4px 14px 10px;overflow:visible">${body||'<div class="empty">No entries</div>'}${list.length>shown.length?`<div style="text-align:center;padding-top:12px"><button class="b" id="lg-more">Show more (${list.length-shown.length})</button></div>`:''}</div>`}

const EC={navy:'FF0F1C3F',hd:'FF1E3A8A',pri:'FF1D4ED8',red:'FFFDE8E8',redt:'FFB91C1C',amb:'FFFFF4D6',ambt:'FF92400E',grn:'FFE3F6EA',grnt:'FF15803D',bd:'FFE1E6EF',wh:'FFFFFFFF',mut:'FF6B7791'};
const RH=['Agent Name','Shift Start','Login Time','First Active','Late Arrival','Emergency','Break Total','Work Total','Call No Ans','Appt. Confirm >2m','Restricted Time','Logout Time','Received','Status'];
const RW=[26,12,12,12,13,15,13,13,12,15,22,16,11,12];

const edge=()=>({style:'thin',color:{argb:EC.bd}});

function repRow(d,o){
  const f=(bad,t)=>bad?(exd(d,o.name,t)?2:1):0,n=nvForDate(d,o);
  const lv=[['lbrk',o.lbrkV],['lwork',o.lworkV]].filter(x=>x[1]),open=lv.some(x=>!exd(d,o.name,x[0]));
  const rs=[o.lbrkV?'Break '+o.lbrk[0]:'',o.lworkV?'Work '+o.lwork[0]:''].filter(Boolean).join(' · ')||'—';
  return{d,vals:[o.name,o.hasLogin?hms(o.shift):'Prev. day',o.hasLogin?hms(o.login):'Prev. day',o.first!=null?hms(o.first):'—',
    formatDuration(mn(o.late)),o.em.n?o.em.n+' / '+formatDuration(mn(o.em.s)):'0',formatDuration(mn(o.brk)),o.exempt?'—':formatDuration(mn(o.work)),o.cna,o.exempt?'—':o.appt,rs,
    formatTimeOut(o.out),rcnt(o),n?n+' open':'Clean'],
    fl:[f(o.lateV,'late'),f(o.emV,'emerg'),f(o.brkV,'brk'),f(o.workV,'work'),f(o.cna,'cna'),f(o.apptV,'appt'),open?1:(lv.length?2:0),f(o.recvV,'recv')]}}

async function collectRows(dates){
  const ms=new Set();[addDays(dates[0],-1),...dates,addDays(dates[dates.length-1],1)].forEach(d=>ms.add(d.slice(0,7)));
  for(const m of ms)await loadMonth(m);
  const out=[];dates.forEach(d=>agentsOf(d).sort().forEach(n=>out.push(repRow(d,calc(d,n)))));
  return out}

function styleBody(cell,c,fl){
  cell.font=EF();cell.alignment={vertical:'middle',horizontal:c===1?'left':'center'};cell.border=BORD();
  const fk=FLCOL.indexOf(c);if(fk>=0){const v=fl[fk];
    if(v===1){cell.fill=fillOf(c===13?'FFFFEDD5':EC.red);cell.font=EF({bold:true,color:{argb:c===13?'FFC2410C':EC.redt}})}
    else if(v===2){cell.fill=fillOf(EC.grn);cell.font=EF({color:{argb:EC.grnt},strike:true})}}
  if(c===NC){const s=String(cell.value);cell.font=EF({bold:true,color:{argb:s==='Clean'?EC.grnt:EC.redt}});cell.fill=fillOf(s==='Clean'?EC.grn:EC.red)}}

function headStyle(ws,rowNo){const r=ws.getRow(rowNo);r.height=30;
  RH.forEach((h,i)=>{const c=r.getCell(i+1);c.value=h;c.font=EF({bold:true,color:{argb:EC.wh}});c.fill=fillOf(EC.hd);c.alignment={vertical:'middle',horizontal:'center',wrapText:true};c.border=BORD()})}

function titleBlock(ws,text){
  ws.mergeCells('A1:'+colL(NC)+'1');const t=ws.getCell('A1');t.value=text;t.font=EF({size:14,bold:true,color:{argb:EC.wh}});t.fill=fillOf(EC.navy);t.alignment={vertical:'middle',horizontal:'left',indent:1};ws.getRow(1).height=32;
  RW.forEach((w,i)=>{ws.getColumn(i+1).width=w})}

function kpiCells(ws,vals){
  [['Agents',vals[0]],['Late arrivals',vals[1]],['Emergency',vals[2]],['Open violations',vals[3]]].forEach((k,i)=>{
    const l=ws.getCell(3,1+i*3),v=ws.getCell(3,2+i*3);
    l.value=k[0];l.font=EF({bold:true,color:{argb:EC.mut}});l.alignment={horizontal:'left'};
    v.value=k[1];v.font=EF({size:12,bold:true,color:{argb:EC.pri}});v.alignment={horizontal:'left'}});
  ws.getRow(3).height=22}

async function exportReport(dates,mode){
  const rows=await collectRows(dates);
  if(!rows.length)throw new Error(mode==='day'?'No data for '+dmy(dates[0]):'No data in this period');
  const wb=new ExcelJS.Workbook();wb.calcProperties={fullCalcOnLoad:true};
  const ws=wb.addWorksheet('Report',{views:[{state:'frozen',ySplit:5,showGridLines:false}]});
  titleBlock(ws,'PERFORMANCE CONTACT CENTER — '+(mode==='day'?'DAILY REPORT':'PERIOD REPORT'));
  const lab=ws.getCell('A2');lab.value='Report date:';lab.font=EF({size:11,bold:true,color:{argb:EC.pri}});
  const pick=ws.getCell('B2');pick.font=EF({size:11,bold:true,color:{argb:EC.wh}});pick.fill=fillOf(EC.pri);pick.alignment={horizontal:'center',vertical:'middle'};pick.numFmt='@';ws.getRow(2).height=24;
  headStyle(ws,5);
  if(mode==='day'){
    pick.value=dmy(dates[0]);
    const cnt=k=>rows.filter(r=>r.fl[k]===1).length;

  }else{

    const F0=NC+2,MC=F0+NF,PC=MC+1,HC=NC+2; // first flag col, match col, pos col, report helper col (1-based)
    const rg=c=>'Data!$'+c+'$2:$'+c+'$'+LAST,POS=rg(colL(PC)),H=colL(HC);
    const ls=wb.addWorksheet('Lists');ls.getColumn(1).numFmt='@';ls.getColumn(1).width=14;ls.getCell('A1').value='Dates';ls.getCell('A1').font=EF({bold:true});
    dates.forEach((d,i)=>{ls.getCell(i+2,1).value=dmy(d)});
    const ds=wb.addWorksheet('Data');
    const DH=['Date',...RH,'Flag Late','Flag Emerg','Flag Break','Flag Work','Flag CNA','Flag Appt','Flag Restricted','Flag Received','Match','Pos'];
    DH.forEach((h,i)=>{const c=ds.getCell(1,i+1);c.value=h;c.font=EF({bold:true,color:{argb:EC.wh}});c.fill=fillOf(i<NC+1?EC.hd:EC.mut);c.alignment={horizontal:'center',vertical:'middle',wrapText:true}});
    ds.getColumn(1).numFmt='@';ds.getColumn(1).width=13;ds.getColumn(2).width=26;for(let i=3;i<MC;i++)ds.getColumn(i).width=13;
    ds.getColumn(MC).hidden=true;ds.getColumn(PC).hidden=true;ds.views=[{state:'frozen',ySplit:1}];
    rows.forEach((r,i)=>{const row=ds.getRow(2+i);row.getCell(1).value=dmy(r.d);r.vals.forEach((v,k)=>{row.getCell(2+k).value=v});r.fl.forEach((v,k)=>{row.getCell(F0+k).value=v})});
    const mc=colL(MC),pc=colL(PC);
    for(let r=2;r<=LAST;r++){
      const m='AND($A'+r+'<>"",TRIM($A'+r+')=TRIM(Report!$B$2))';
      ds.getCell(r,MC).value={formula:'IF('+m+',1,0)+N('+mc+(r-1)+')'};
      ds.getCell(r,PC).value={formula:'IF('+m+','+mc+r+',"")'}}
    const first=dates.includes(date)&&agentsOf(date).length?date:(dates.find(d=>agentsOf(d).length)||dates[0]);
    pick.value=dmy(first);
    pick.dataValidation={type:'list',allowBlank:false,showErrorMessage:true,errorTitle:'Invalid date',error:'Choose a date from the list.',formulae:['Lists!$A$2:$A$'+(dates.length+1)]};
    const hint=ws.getCell('C2');hint.value='◀ choose a date from the list — the table shows only that date';hint.font=EF({italic:true,color:{argb:EC.mut}});
    const fc=k=>rg(colL(F0+k)),isn='--ISNUMBER('+POS+')';
    const openSum=Array.from({length:NF},(_,k)=>'('+fc(k)+'=1)').join('+');
    kpiCells(ws,[{formula:'COUNT('+POS+')'},{formula:'SUMPRODUCT('+isn+',--('+fc(0)+'=1))'},{formula:'SUMPRODUCT('+isn+',--('+fc(1)+'=1))'},{formula:'SUMPRODUCT('+isn+','+openSum+')'}]);
    const nd=ws.getCell('A4');nd.value={formula:'IF(COUNT('+POS+')=0,"No data for this date — add its rows in the Data sheet (see Guide).","")'};nd.font=EF({italic:true,bold:true,color:{argb:EC.redt}});
    ws.getColumn(HC).hidden=true;
    for(let i=0;i<N;i++){const r=TOP+i,row=ws.getRow(r);row.height=20;
      row.getCell(HC).value={formula:'IFERROR(MATCH(ROW()-'+(TOP-1)+','+POS+',0),"")'};
      for(let c=1;c<=NC;c++){const L=colL(c+1),ix='INDEX('+rg(L)+',$'+H+r+')',cell=row.getCell(c);
        cell.value={formula:'IF($'+H+r+'="","",IF('+ix+'="","",'+ix+'))'};
        cell.font=EF();cell.alignment={vertical:'middle',horizontal:c===1?'left':'center'};cell.border=BORD()}}
    const END=TOP+N-1,flag=k=>'INDEX('+fc(k)+',$'+H+TOP+')';
    const cf=(ref,formula,fill,font)=>ws.addConditionalFormatting({ref,rules:[{type:'expression',formulae:[formula],style:{fill:{type:'pattern',pattern:'solid',bgColor:{argb:fill}},font}}]});
    for(let k=0;k<NF;k++){const col=colL(FLCOL[k]),ref=col+TOP+':'+col+END,orange=FLCOL[k]===13;
      cf(ref,'AND($'+H+TOP+'<>"",'+flag(k)+'=1)',orange?'FFFFEDD5':EC.red,{bold:true,color:{argb:orange?'FFC2410C':EC.redt}});
      cf(ref,'AND($'+H+TOP+'<>"",'+flag(k)+'=2)',EC.grn,{strike:true,color:{argb:EC.grnt}})}

    cf(sc+TOP+':'+sc+END,'AND('+sc+TOP+'<>"",'+sc+TOP+'<>"Clean")',EC.red,{bold:true,color:{argb:EC.redt}});
    const gs=wb.addWorksheet('Guide');gs.getColumn(1).width=120;
    ['How to use this workbook',
     '1. On the Report sheet pick a date in cell B2 (dropdown). The table shows only that date and replaces the previous one.',
     '2. The dropdown lists every day of the period. A day with no data shows a red message under the title.',
     '3. To add a missing date: open the Data sheet and type its rows under the last row, columns A to '+colL(NC+1)+'. Nothing else needs to change.',
     '4. Column A must be the date as text exactly like the dropdown (dd/mm/yyyy), for example 15/10/2026. The column is already formatted as Text.',

     'Colours: red = violation, green with strikethrough = excused by management.',

  }
  const buf=await wb.xlsx.writeBuffer();

  const a=document.createElement('a');a.href=url;a.download=mode==='day'?'Performance_Report_'+dates[0]+'.xlsx':'Performance_Report_'+dates[0]+'_to_'+dates[dates.length-1]+'.xlsx';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}

        const cred=await secApp.auth().createUserWithEmailAndPassword(em,pw);
        await DB.doc('users/'+cred.user.uid).set({email:em,active:true,role:role,created:Date.now(),by:MEN});
        await secApp.delete();logA('Create user',em+' · '+role);
        $('#nu-msg').textContent='User created successfully!';
        $('#nu-em').value=''; $('#nu-pw').value='';
      }catch(err){alert('Error: '+err.message)}
    })();
  }
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='dt'&&t.value){date=t.value;month=date.slice(0,7);render()}
  else if(t.id==='mo'&&t.value){month=t.value;render()}
  else if(t.id==='f'&&t.files[0])importFile(t.files[0]);
  else if(t.dataset.sh){const k=date+'|'+t.dataset.sh;S.shifts[k]=t.value;persistMap('sh',k);logA('Shift start',dmy(date)+' · '+t.dataset.sh+' = '+t.value);render()}
  else if(t.id==='agent-select'){window.MONTH_SELECTED_AGENT=t.value;window.LK_T='';render()}
});
render();
document.addEventListener('click',e=>{if(e.target.closest('[data-exp]'))openExport();if(e.target.id==='th'){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0b1020';r.dataset.theme=d?'light':'dark'}});
document.addEventListener('input',e=>{if(e.target.id==='q'){window.Q=e.target.value;const p=e.target.selectionStart;render();const q=$('#q');if(q){q.focus();q.setSelectionRange(p,p)}}});
document.addEventListener('click',e=>{if(e.target.id==='so')firebase.auth().signOut()});
document.addEventListener('click',async e=>{const id=e.target.id;
  if(id==='xc'||id==='mdl'){const m=document.getElementById('mdl');if(m)m.remove();return}
  if(id==='nx1'){saveNote(true);return}
  if(id==='nx0'||id==='nxs'){saveNote(false);return}
  if(id==='addday'){WANT=date;pickFile();return}
  if(id==='x1'||id==='x2'){const msg=$('#xm'),btn=e.target;btn.disabled=true;msg.textContent='Preparing\u2026';
    try{let dates;
      if(id==='x1')dates=[date];
      else{const f=$('#xf').value,t=$('#xt').value;if(!f||!t||f>t)throw new Error('choose a valid period');
        dates=[];for(let d=f;d<=t&&dates.length<=366;d=addDays(d,1))dates.push(d);if(dates.length>366)throw new Error('maximum period is 366 days')}
      await exportReport(dates,id==='x1'?'day':'period');msg.textContent='Done \u2713'}
    catch(err){msg.textContent='Failed: '+err.message}
    btn.disabled=false}});

function prefillFromCalc(name){const o=calc(date,name),hm=x=>x==null?'':hms(x).slice(0,5);
  return{shift:o.hasLogin?hm(o.shift):'',login:o.hasLogin?hm(o.login):'',first:hm(o.first),out:hm(o.out),outNext:o.out!=null&&o.out>=86400,brk:Math.round(o.brk/60),work:Math.round(o.work/60),emN:o.em.n,emM:Math.round(o.em.s/60),cna:o.cna,appt:o.appt,recv:rcnt(o),lbrk:o.lbrk.length>0,lwork:o.lwork.length>0}}
async function delAgent(name){if(!confirm('Delete ALL data of '+name+' for '+dmy(date)+'?\nThis removes the agent from this date.'))return;
  const d=date;
  if(S.days[d]&&S.days[d][name]){delete S.days[d][name];S.idx[d]=S.idx[d]||{a:0,t:0,f:'',p:0};S.idx[d].a=Object.keys(S.days[d]).length;S.idx[d].t=Date.now();await saveDay(d);await saveIdx()}
  const k=d+'|'+name;if(S.man[k]){delete S.man[k];persistMap('mn',k)}
  logA('Delete agent data',dmy(d)+' · '+name);render()}
function openMan(name){
  const r=(name&&S.man[date+'|'+name])||(name?prefillFromCalc(name):{}),hasEv=!!(name&&S.days[date]&&S.days[date][name]);
  const known=[...new Set([...Object.keys(S.days).flatMap(d=>Object.keys(S.days[d])),...Object.keys(S.man).map(k=>k.slice(11))])].sort();
  const f=(id,lab,val,type)=>`<label class="tag" style="display:grid;gap:3px">${lab}<input id="${id}" type="${type||'text'}" ${type==='number'?'min="0"':''} value="${esc(val==null||val===0&&type==='number'?'':val)}" style="width:100%"></label>`;
  const ck=(id,lab,on)=>`<label class="tag" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="${id}" ${on?'checked':''}> ${lab}</label>`;
  const m=document.createElement('div');m.id='mdl';m.style.cssText=MS;
  m.innerHTML=`<div class="card" style="padding:22px;width:min(580px,100%);max-height:92vh;overflow:auto;margin:0"><h2 style="margin-top:0;font-size:18px">${name?'Edit':'Add'} agent data — ${dmy(date)}</h2>
  <p class="hint">Use this when the report did not include an agent or part of the data. These values replace the report data of this agent for this date.</p>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
  <label class="tag" style="grid-column:1/-1;display:grid;gap:3px">Agent name<input id="mn-name" list="mn-dl" value="${esc(name||'')}" ${name?'readonly':''} style="width:100%"><datalist id="mn-dl">${known.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></label>
  ${f('mn-shift','Shift start',r.shift,'time')}${f('mn-login','Login time',r.login,'time')}
  ${f('mn-first','First active (ready) time',r.first,'time')}${f('mn-out','Logout time',r.out,'time')}
  ${f('mn-brk','Break total (min)',r.brk,'number')}${f('mn-work','Work total (min)',r.work,'number')}
  ${f('mn-emn','Emergency (count)',r.emN,'number')}${f('mn-emm','Emergency (minutes)',r.emM,'number')}
  ${f('mn-cna','Call no answer (count)',r.cna,'number')}${f('mn-appt','Appointment confirmations >2 min (count)',r.appt,'number')}
  ${f('mn-recv','Received 1–2 sec (count)',r.recv,'number')}${ck('mn-outn','Logout is on the next day',r.outNext)}
  ${ck('mn-lb','Break in the last 15 min of the shift',r.lbrk)}${ck('mn-lw','Work in the last 5 min of the shift',r.lwork)}
  <label class="tag" style="grid-column:1/-1;display:grid;gap:3px">Note<textarea id="mn-note" rows="2" style="width:100%;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)">${esc(r.note||'')}</textarea></label></div>
  ${hasEv?'<p class="hint" style="margin-top:10px">This agent has report data for this date. Saving overrides it until you delete the manual entry.</p>':''}
  <div class="bar" style="margin:14px 0 0"><button class="b p" id="mn-save">Save</button>${r.name?'<button class="b" id="mn-del">Delete manual entry</button>':''}<button class="b" id="xc" style="margin-left:auto">Cancel</button><span class="tag" id="mn-msg"></span></div></div>`;
  document.body.appendChild(m)}
function saveMan(){const g=id=>($('#'+id)||{}).value||'',c=id=>!!($('#'+id)||{}).checked;
  const name=g('mn-name').trim().replace(/\s+/g,' ');if(!name){$('#mn-msg').textContent='Enter the agent name.';return}
  const rec={name,shift:g('mn-shift'),login:g('mn-login'),first:g('mn-first'),out:g('mn-out'),outNext:c('mn-outn'),brk:+g('mn-brk')||0,work:+g('mn-work')||0,emN:+g('mn-emn')||0,emM:+g('mn-emm')||0,cna:+g('mn-cna')||0,appt:+g('mn-appt')||0,recv:+g('mn-recv')||0,lbrk:c('mn-lb'),lwork:c('mn-lw'),note:g('mn-note').trim(),by:MEN,t:Date.now()};
  const k=date+'|'+name;S.man[k]=rec;persistMap('mn',k);logA('Manual entry',dmy(date)+' · '+name+(rec.note?' — '+rec.note:''));
  const m=document.getElementById('mdl');if(m)m.remove();render()}
function delMan(){const n=($('#mn-name')||{}).value,k=date+'|'+n;delete S.man[k];persistMap('mn',k);logA('Delete manual entry',dmy(date)+' · '+n);const m=document.getElementById('mdl');if(m)m.remove();render()}
document.addEventListener('click',e=>{if(USER_ROLE==='viewer'&&e.target.closest('[data-ex],[data-del],#addman,#mn-save,#mn-del,#ex-add,[data-exdel],[data-man],[data-aedit],[data-adel]')){e.stopPropagation();alert('This is a read-only account.')}},true);
document.addEventListener('click',e=>{const t=e.target,id=t.id,x=t.closest('[data-man]'),xd=t.closest('[data-exdel]');
  if(id==='addman')openMan(null);
  else if(x)openMan(x.dataset.man);
  else if(id==='mn-save')saveMan();
  else if(id==='mn-del')delMan();
  else if(id==='ex-add'){const v=($('#ex-in').value||'').trim().replace(/\s+/g,' ');if(!v)return;S.cfg=S.cfg||{exempt:[]};if(!S.cfg.exempt.some(n=>nz(n)===nz(v))){S.cfg.exempt.push(v);saveCfg();logA('Exempt agent added',v)}render()}
  else if(xd){const i=+xd.dataset.exdel,n=S.cfg.exempt[i];S.cfg.exempt.splice(i,1);saveCfg();logA('Exempt agent removed',n);render()}});
document.addEventListener('click',e=>{const t=e.target,a=t.closest('[data-aedit]'),d=t.closest('[data-adel]'),l=t.closest('[data-lt]'),c=t.closest('[data-lc]');
  if(a)openMan(a.dataset.aedit);
  else if(d)delAgent(d.dataset.adel);
  else if(l){window.LK_T=l.dataset.lt;render()}
  else if(c){window.LG_C=c.dataset.lc;window.LG_N=60;render()}
  else if(t.id==='lg-more'){window.LG_N=(window.LG_N||60)+60;render()}});
document.addEventListener('input',e=>{if(e.target.id==='lg-q'){window.LG_Q=e.target.value;window.LG_N=60;const p=e.target.selectionStart;render();const q=$('#lg-q');if(q){q.focus();q.setSelectionRange(p,p)}}});
boot();
</script></body></html>
