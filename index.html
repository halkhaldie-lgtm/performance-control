<header><h1>Performance Control Center<small>Agent attendance &amp; conduct monitoring</small></h1>

<main id="app"></main>
<script>
const LIM={grace:300,emerg:180,brk:43*60,work:300,cna:6,shift:8*3600};
let S={days:{},idx:{},shifts:{},ex:{},recv:'1,2'},tab='dash',date='',month='';const FB_CONFIG={apiKey:"AIzaSyC5wAmajiFgKEAfi4Ay0ZA1QGL-KS4K9zo",authDomain:"performance-control-ab7f9.firebaseapp.com",projectId:"performance-control-ab7f9",storageBucket:"performance-control-ab7f9.firebasestorage.app",messagingSenderId:"599359001764",appId:"1:599359001764:web:8ae96947247d8036b60231"};
let MEN='',DB=null,ME=null,LOADED={},LOGS=null,LOCALCOPY=null,USER_ROLE='editor';
try{const r=localStorage.getItem('pcc_v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{if(DB)return;try{localStorage.setItem('pcc_v1',JSON.stringify(S))}catch(e){alert('Storage is full.')}};
const $=q=>document.querySelector(q);
const pad=n=>String(n).padStart(2,'0');
const hms=s=>pad(Math.floor(s/3600)%24)+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60);
const dmy=d=>d.split('-').reverse().join('/');
const mn=s=>Math.floor(s/60);
const tosec=h=>{const m=/^(\d+):(\d+)/.exec(h||'');return m?m[1]*3600+m[2]*60:null};

function addDays(dStr, n){const d=new Date(dStr+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}

/* ---------- IMPORT ---------- */
function pt(v){
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400)*1000);return[d.toISOString().slice(0,10),d.getUTCHours()*3600+d.getUTCMinutes()*60+d.getUTCSeconds()]}
  const m=/(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+):(\d+)\s*(AM|PM)?/i.exec(String(v));if(!m)return null;
  let y=+m[3];if(y<100)y+=2000;let h=+m[4]%12;if(/pm/i.test(m[7]||''))h+=12;if(!m[7])h=+m[4];
  return[y+'-'+pad(m[1])+'-'+pad(m[2]),h*3600+m[5]*60+ +m[6]]}
function pd(v){if(typeof v==='number')return Math.round(v*86400);const m=/(\d+):(\d+):(\d+)/.exec(String(v));return m?m[1]*3600+m[2]*60+ +m[3]:0}
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function saveDay(d){
  if(!DB){save();return}
  const ag=S.days[d],parts=[];let cur={},sz=0;
  Object.keys(ag).forEach(n=>{const l=JSON.stringify(ag[n]).length;if(sz+l>200000&&Object.keys(cur).length){parts.push(cur);cur={};sz=0}cur[n]=ag[n];sz+=l});parts.push(cur);
  const old=(S.idx[d]&&S.idx[d].p)||0;
  for(let i=0;i<parts.length;i++)await DB.doc('days/'+d+'_'+i).set({date:d,month:d.slice(0,7),agents:JSON.stringify(parts[i])});
  for(let i=parts.length;i<old;i++)try{await DB.doc('days/'+d+'_'+i).delete()}catch(e){}
  S.idx[d].p=parts.length}
async function saveIdx(){if(!DB){save();return}await DB.doc('meta/index').set({dates:S.idx})}
function persistMap(c,k){if(!DB){save();return}const m=k.slice(0,7),src=c==='ex'?S.ex:S.shifts,sub={};
  Object.keys(src).filter(x=>x.startsWith(m)).forEach(x=>sub[x]=src[x]);DB.doc(c+'/'+m).set({m:sub}).catch(()=>{})}
async function logA(a,d){const r={t:Date.now(),a,d};if(DB){try{await DB.collection('log').add(Object.assign({u:ME,n:MEN},r))}catch(e){}}else{S.log=(S.log||[]).concat([r]).slice(-500);save()}}
async function loadMonth(m){if(!DB||LOADED[m])return;
  try{const q=await DB.collection('days').where('month','==',m).get();q.docs.forEach(x=>{const v=x.data();S.days[v.date]=Object.assign(S.days[v.date]||{},typeof v.agents==='string'?JSON.parse(v.agents):v.agents)});
    for(const c of ['ex','sh']){const g=await DB.doc(c+'/'+m).get();if(g.exists)Object.assign(c==='ex'?S.ex:S.shifts,g.data().m||{})}}catch(e){}
  LOADED[m]=1}
async function delDay(d){const p=(S.idx[d]||{}).p||1;delete S.days[d];delete S.idx[d];
  if(DB){for(let i=0;i<p;i++)try{await DB.doc('days/'+d+'_'+i).delete()}catch(e){}}
  await saveIdx();logA('Delete day',dmy(d));render()}
async function restoreData(b){const ds=Object.keys(b.days||{});
  for(const d of ds){S.days[d]=b.days[d];S.idx[d]={a:Object.keys(b.days[d]).length,t:Date.now(),f:'restore',p:0};await saveDay(d)}
  Object.assign(S.ex,b.ex||{});Object.assign(S.shifts,b.shifts||{});
  new Set([...Object.keys(b.ex||{}),...Object.keys(b.shifts||{})].map(k=>k.slice(0,7))).forEach(m=>{persistMap('ex',m);persistMap('sh',m)});
  await saveIdx();logA('Restore',ds.length+' day(s)');render()}
async function loadLogs(){
  if(DB){try{const q=await DB.collection('log').orderBy('t','desc').limit(300).get();LOGS=q.docs.map(x=>x.data());}catch(e){LOGS=[]}}
  else LOGS=(S.log||[]).slice().reverse()}
function logv(){return`<p class="hint">Audit log tracking all actions.</p><div class="card"><table style="min-width:700px"><thead><tr><th>When</th><th>User</th><th>Action</th><th>Detail</th></tr></thead><tbody>${(LOGS||[]).map(x=>`<tr><td>${new Date(x.t).toLocaleString()}</td><td>${esc(x.n||'\u2014')}</td><td class="n">${esc(x.a)}</td><td style="white-space:normal">${esc(x.d)}</td></tr>`).join('')||'<tr><td colspan=4 class="empty">No activity yet</td></tr>'}</tbody></table></div>`}

function showLogin(msg){let m=document.getElementById('lg');if(!m){m=document.createElement('div');m.id='lg';m.style.cssText='position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px';
  m.innerHTML=`<div class="card" style="padding:28px;width:min(380px,100%);overflow:visible;margin:0"><h2 style="margin-top:0;font-size:20px">Performance Control Center</h2><p class="hint">Sign in to continue</p><div style="display:grid;gap:10px"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="b p" id="si">Sign in</button><div id="adm-box" style="margin-top:10px;border-top:1px solid var(--bd);padding-top:10px;display:none"><p style="font-size:12px;margin:0 0 6px;font-weight:600">Admin: Create new user</p><input id="nem" type="email" placeholder="New User Email" style="margin-bottom:6px;width:100%"><input id="npw" type="password" placeholder="New Password" style="margin-bottom:6px;width:100%"><select id="nrole" style="margin-bottom:6px;width:100%"><option value="editor">Editor</option><option value="admin">Admin</option></select><button class="b" id="nsub" style="width:100%">Create User</button></div><span id="le" style="color:var(--redt);font-size:12px"></span></div></div>`;
  document.body.appendChild(m);
  const go=async()=>{$('#le').textContent='';try{await firebase.auth().signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value)}catch(e){$('#le').textContent='Sign-in failed: '+(e.code||e.message)}};
  $('#si').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
  $('#nsub').onclick=async()=>{
    const ne=$('#nem').value.trim(),np=$('#npw').value,nr=$('#nrole').value;
    if(!ne||!np){alert('Enter email and password');return}
    try{
      // Create user using a secondary app or direct method if permitted, or inform admin
      const secondaryApp = firebase.initializeApp(FB_CONFIG, "Secondary");
      const secAuth = secondaryApp.auth();
      const cred = await secAuth.createUserWithEmailAndPassword(ne, np);
      await DB.doc('users/'+cred.user.uid).set({active:true, role:nr});
      await secondaryApp.delete();
      alert('User created successfully!');
      $('#nem').value='';$('#npw').value='';
    }catch(err){alert('Error creating user: '+err.message);}
  };}
  if(msg)$('#le').textContent=msg}
function hideLogin(){const m=document.getElementById('lg');if(m)m.remove()}
async function boot(){
  if(!window.firebase){showLogin('Could not load Firebase.');return}
  firebase.initializeApp(FB_CONFIG);const auth=firebase.auth();
  auth.onAuthStateChanged(async u=>{
    if(!u){DB=null;$('#app').innerHTML='';showLogin();return}
    hideLogin();DB=firebase.firestore();ME=u.uid;MEN=u.email||'';
    try{
      const uDoc=await DB.doc('users/'+ME).get();
      if(uDoc.exists){USER_ROLE=uDoc.data().role||'editor';}
      if(USER_ROLE==='admin'&&$('#adm-box')){$('#adm-box').style.display='block';}
      const g=await DB.doc('meta/index').get();S.idx=g.exists?(g.data().dates||{}):{}
    }catch(e){}
    S.days={};S.ex={};S.shifts={};LOADED={};date='';month='';LOCALCOPY=null;
    $('#st').textContent='\u25cf '+MEN;render()})}

function ask(dup,ag,ds,apply){const m=document.createElement('div');m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px';
  m.innerHTML=`<div class="card" style="padding:22px;max-width:480px;overflow:visible;margin:0"><h2 style="margin-top:0">Data for this date already exists</h2><p>${dup.map(d=>`<b>${dmy(d)}</b> — saved:${S.idx[d].a} agents · new file: ${Object.keys(ag[d]).length} agents`).join('<br>')}</p><p>Replace the saved data with this file, or cancel?</p><div class="bar" style="margin:0"><button class="b p" id="mr">Replace</button><button class="b" id="mc">Cancel</button></div></div>`;
  document.body.appendChild(m);$('#mr').onclick=()=>{m.remove();apply(ds)};$('#mc').onclick=()=>{m.remove();apply(ds.filter(d=>!dup.includes(d)))}}
function importFile(f){
  const rd=new FileReader();rd.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true});
    const hi=rows.findIndex(r=>String(r[0]||'').trim()==='Agent Name');if(hi<0){alert('Header row "Agent Name" not found.');return}
    const ag={},seenR={};let n=0;
    rows.slice(hi+1).forEach(r=>{
      if(!r[0]||!r[3])return;const t=pt(r[3]);if(!t)return;
      const name=String(r[0]).trim(),st=String(r[4]||'').trim(),re=String(r[5]||'').trim(),d=pd(r[6]);
      const k=t[0]+'|'+name;let ev=null;
      if(/^logged-in/i.test(st)){ev=[t[1],'I','',0];seenR[k]=0}
      else if(/^logout/i.test(st))ev=[t[1],'O',re,0];
      else if(/^ready/i.test(st)){if(!seenR[k]){seenR[k]=1;ev=[t[1],'R','',0]}}
      else if(/^not ready/i.test(st)&&/^(break|work)$|no answer/i.test(re))ev=[t[1],'N',re,d];
      else if(/^(reserved|receiv)/i.test(st)&&d<=10)ev=[t[1],'V','',d];
      if(!ev)return;(ag[t[0]]=ag[t[0]]||{});(ag[t[0]][name]=ag[t[0]][name]||[]).push(ev);n++});
    const ds=Object.keys(ag);if(!ds.length){alert('No usable rows found.');return}
    ds.sort();const dup=ds.filter(d=>S.idx[d]);
    const apply=async keep=>{for(const d of keep){S.days[d]=ag[d];S.idx[d]={a:Object.keys(ag[d]).length,t:Date.now(),f:f.name||'',p:0};await saveDay(d);logA('Import',dmy(d)+' · '+(f.name||'file')+' · '+S.idx[d].a+' agents')}
      if(keep.length){await saveIdx();date=keep[keep.length-1];month=date.slice(0,7);tab='dash'}render()};
    if(dup.length)ask(dup,ag,ds,apply);else apply(ds);
  };rd.readAsArrayBuffer(f)}

/* ---------- CALC (with next day support for logout) ---------- */
function getEventsForAgent(dt, name) {
  let evs = (S.days[dt] && S.days[dt][name]) ? [...S.days[dt][name]] : [];
  const nextDt = addDays(dt, 1);
  if (S.days[nextDt] && S.days[nextDt][name]) {
    // include events from next day normalized by adding 86400 to timestamp
    const nextEvs = S.days[nextDt][name].map(e => [e[0] + 86400, e[1], e[2], e[3]]);
    evs = evs.concat(nextEvs);
  }
  return evs.sort((a,b)=>a[0]-b[0]);
}

function calc(dt,name){
  const ev=getEventsForAgent(dt, name);
  const li=ev.find(e=>e[1]==='I');const login=li?li[0]:(ev[0]?ev[0][0]:0);
  const auto=Math.round(login/3600)*3600;const sh=tosec(S.shifts[dt+'|'+name]);const shift=sh==null?auto:sh;
  const fr=li?ev.find(e=>e[1]==='R'&&e[0]>=login):null;
  const late=fr?Math.max(0,fr[0]-shift):0;
  const o={name,login,shift,hasLogin:!!li,outEm:false,auto:sh==null,first:fr?fr[0]:null,late,lateV:late>LIM.grace,
    rt:[],lo:{n:0,s:0},em:{n:0,s:0},brk:0,work:0,cna:0,out:null,outEarly:0,recv:{}};
  ev.forEach((e,i)=>{
    if(e[1]==='O'){if(li&&e[0]<login)return;const nx=ev.slice(i+1).find(x=>x[1]==='I');
      if(!nx){o.out=e[0];if(/emergency/i.test(e[2])){o.em.n++;o.outEm=true}return}
      const g=nx[0]-e[0];if(g>LIM.emerg){const b=/emergency/i.test(e[2])?o.em:o.lo;b.n++;b.s+=g}}
    else if(e[1]==='N'){if(/^break/i.test(e[2]))o.brk+=e[3];else if(/^work$/i.test(e[2]))o.work+=e[3];else if(/no answer/i.test(e[2])&&e[3]>LIM.cna)o.cna++}
    else if(e[1]==='V'){o.recv[e[3]]=(o.recv[e[3]]||0)+1;if(e[3]<3)o.rt.push(hms(e[0])+' ('+e[3]+'s)')}});
  if(li&&!o.outEm&&o.out!=null&&o.out<login+LIM.shift)o.outEarly=login+LIM.shift-o.out;
  o.brkV=o.brk>LIM.brk;o.workV=o.work>LIM.work;
  return o}

const ek=(d,n,t)=>d+'|'+n+'|'+t;
const exd=(d,n,t)=>!!S.ex[ek(d,n,t)];
function viol(dt,o){
  const v=[];
  if(o.lateV)v.push({t:'late',l:'Late arrival',v:mn(o.late)+' min'});
  if(o.lo.n)v.push({t:'logout',l:'Logout ×'+o.lo.n,v:mn(o.lo.s)+' min'});
  if(o.em.n)v.push({t:'emerg',l:'Emergency ×'+o.em.n,v:mn(o.em.s)+' min'});
  if(o.brkV)v.push({t:'brk',l:'Break overrun',v:mn(o.brk-LIM.brk)+' min over'});
  if(o.workV)v.push({t:'work',l:'Work overrun',v:mn(o.work-LIM.work)+' min over'});
  if(o.cna)v.push({t:'cna',l:'Call No Answer',v:o.cna+' call(s)'});
  if(o.outEarly)v.push({t:'early',l:'Early logout',v:mn(o.outEarly)+' min short'});
  return v}
const TY=[['late','Late'],['logout','Logout'],['emerg','Emergency'],['brk','Break'],['work','Work'],['cna','Call No Answer'],['early','Early Logout']];

/* ---------- VIEWS ---------- */
function cell(dt,o,t,bad,txt,cls){
  if(!bad)return`<td class="c ok">${txt}</td>`;
  const x=exd(dt,o.name,t);
  return`<td class="c ${x?'x':cls||'v'}" data-ex="${dt}|${o.name}|${t}">${txt}</td>`}
function formatTimeOut(ts){
  if(ts==null)return'—';
  const sec = ts % 86400;
  const dayOffset = Math.floor(ts / 86400);
  const tStr = hms(sec);
  return dayOffset > 0 ? tStr + ' (+1d)' : tStr;
}
function dash(){
  const q=(window.Q||'').toLowerCase();const names=Object.keys(S.days[date]||{}).sort().filter(n=>n.toLowerCase().includes(q));
  if(!names.length)return`<div class="card"><div class="empty">No data for ${dmy(date||'—')}. Import a report in the <b>Data</b> tab.</div></div>`;
  const rs=names.map(n=>calc(date,n));let tv=0,ex=0;
  rs.forEach(o=>viol(date,o).forEach(v=>exd(date,o.name,v.t)?ex++:tv++));
  const ct=f=>rs.filter(o=>f(o)).length;
  const body=rs.map(o=>{const m=v=>v?mn(v):0;
    return`<tr><td class="n">${o.name}</td>
    <td>${o.hasLogin?`<input class="t" type="time" data-sh="${o.name}" value="${hms(o.shift).slice(0,5)}">`:'<span class="tag">Started prev. day</span>'}</td>
    <td>${o.hasLogin?hms(o.login):'Prev. day'}</td><td>${o.first!=null?hms(o.first):'—'}</td>
    ${cell(date,o,'late',o.lateV,m(o.late)+' min')}
    ${cell(date,o,'logout',o.lo.n,o.lo.n?o.lo.n+' / '+mn(o.lo.s)+' min':'0')}
    ${cell(date,o,'emerg',o.em.n,o.em.n?o.em.n+' / '+mn(o.em.s)+' min':'0')}
    ${cell(date,o,'brk',o.brkV,mn(o.brk)+' min')}
    ${cell(date,o,'work',o.workV,mn(o.work)+' min')}
    ${cell(date,o,'cna',o.cna,o.cna)}
    ${cell(date,o,'early',o.outEarly,formatTimeOut(o.out),'w')}<td class="c n">${rcnt(o)}</td><td>${nv(o)?`<span class="chip bad">${nv(o)} open</span>`:'<span class="chip good">Clean</span>'}</td></tr>`}).join('');
  EXP={n:'Daily_'+date,sh:[['Daily',[['Agent','Shift start','Login','First ready','Late (min)','Logouts','Logout min','Emergency','Emergency min','Break (min)','Work (min)','Call no answer','Logout time','Received','Excused'],...rs.map(o=>[o.name,o.hasLogin?hms(o.shift):'',o.hasLogin?hms(o.login):'Prev. day',o.first!=null?hms(o.first):'',o.lateV?mn(o.late):0,o.lo.n,mn(o.lo.s),o.em.n,mn(o.em.s),mn(o.brk),mn(o.work),o.cna,formatTimeOut(o.out),rcnt(o),viol(date,o).filter(v=>exd(date,o.name,v.t)).map(v=>v.l).join('; ')])]]]};
  return`<div style="margin-bottom:12px;font-weight:700;font-size:15px;color:var(--pri)">📅 Report Date: ${dmy(date)}</div>
  <div class="kpis"><div class="k"><b>${names.length}</b><span>Agents</span></div>
  <div class="k"><b>${ct(o=>o.lateV)}</b><span>Late arrivals</span></div>
  <div class="k"><b>${ct(o=>o.lo.n+o.em.n)}</b><span>Disconnections</span></div>
  <div class="k"><b>${ct(o=>o.brkV)}</b><span>Break overruns</span></div>
  <div class="k"><b>${tv}</b><span>Open violations</span></div><div class="k"><b>${ex}</b><span>Excused</span></div><div class="k"><b>${rs.reduce((s,o)=>s+rcnt(o),0)}</b><span>Received</span></div></div>
  <div class="card"><table><thead><tr><th>Agent</th><th>Shift start</th><th>Login</th><th>First ready</th><th>Late</th><th>Logout (count/min)</th><th>Emergency (count/min)</th><th>Break total</th><th>Work total</th><th>Call no answer</th><th>Logout time</th><th class="c">Received</th><th>Status</th></tr></thead><tbody>${body}</tbody></table></div>`}

function monthly(){
  const ds=Object.keys(S.days).filter(d=>d.startsWith(month)).sort();
  if(!ds.length)return`<div class="card"><div class="empty">No data saved for this month.</div></div>`;
  const A={},det=[];
  ds.forEach(d=>Object.keys(S.days[d]).forEach(n=>{const o=calc(d,n);A[n]=A[n]||{};
    viol(d,o).forEach(v=>{const x=exd(d,n,v.t);det.push({d,n,v,x});if(!x)A[n][v.t]=(A[n][v.t]||0)+(v.t==='cna'?o.cna:1)})}));
  const names=Object.keys(A).sort();
  const rows=names.map(n=>{const t=TY.reduce((s,y)=>s+(A[n][y[0]]||0),0);
    return`<tr><td class="n">${n}</td>${TY.map(y=>`<td class="c ${A[n][y[0]]?'v':'ok'}">${A[n][y[0]]||0}</td>`).join('')}<td class="c n">${t}</td></tr>`}).join('');
  det.sort((a,b)=>a.n.localeCompare(b.n)||a.d.localeCompare(b.d));
  const dl=det.map(r=>`<tr><td class="n">${r.n}</td><td>${dmy(r.d)}</td><td>${r.v.l}</td><td>${r.v.v}</td>
    <td class="c ${r.x?'x':'v'}" data-ex="${r.d}|${r.n}|${r.v.t}">${r.x?'Excused – restore':'Cancel violation'}</td></tr>`).join('');
  const T=names.map(n=>[n,TY.reduce((s,y)=>s+(A[n][y[0]]||0),0)]).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,...T.map(x=>x[1]));
  EXP={n:'Monthly_'+month,sh:[['Summary',[['Employee',...TY.map(y=>y[1]),'Total'],...names.map(n=>[n,...TY.map(y=>A[n][y[0]]||0),T.find(x=>x[0]===n)[1]])]],['Incidents',[['Employee','Date','Type','Detail','Status'],...det.map(r=>[r.n,dmy(r.d),r.v.l,r.v.v,r.x?'Excused':'Open'])]]]};
  return`<div style="margin-bottom:12px;font-weight:700;font-size:15px;color:var(--pri)">📅 Monthly Report: ${month}</div>
  ${T.some(x=>x[1])?`<div class="card pad"><h2>Most incidents this month</h2>${T.filter(x=>x[1]).slice(0,8).map(x=>`<div class="br"><span>${x[0]}</span><i style="width:${x[1]/mx*60}%"></i><em>${x[1]}</em></div>`).join('')}</div>`:''}<div class="card"><table><thead><tr><th>Employee</th>${TY.map(y=>`<th class="c">${y[1]}</th>`).join('')}<th class="c">Total</th></tr></thead><tbody>${rows||'<tr><td colspan=9 class="empty">No violations 🎉</td></tr>'}</tbody></table></div>
  <h2>Incident log</h2><div class="card"><table style="min-width:640px"><thead><tr><th>Employee</th><th>Date</th><th>Type</th><th>Detail</th><th class="c">Action</th></tr></thead><tbody>${dl}</tbody></table></div>`}

function recv(){
  const set=S.recv.split(',').map(x=>+x.trim()).filter(x=>x>0);
  const cnt=(d,n)=>{const o=calc(d,n);return set.reduce((s,x)=>s+(o.recv[x]||0),0)};
  const names=[...new Set(Object.keys(S.days).flatMap(d=>Object.keys(S.days[d])))].sort();
  const md=Object.keys(S.days).filter(d=>d.startsWith(month));
  const rows=names.map(n=>{const a=S.days[date]&&S.days[date][n]?cnt(date,n):0;const m=md.reduce((s,d)=>S.days[d][n]?s+cnt(d,n):s,0);
    return`<tr><td class="n">${n}</td><td class="c">${a}</td><td class="c n">${m}</td></tr>`}).join('');
  const R=names.map(n=>[n,S.days[date]&&S.days[date][n]?cnt(date,n):0,md.reduce((s,d)=>S.days[d][n]?s+cnt(d,n):s,0)]);
  const det=names.map(n=>{const e=getEventsForAgent(date,n).filter(e=>e[1]==='V'&&set.includes(e[3])).sort((a,b)=>a[0]-b[0]);return e.length?`<tr><td class="n">${n}</td><td class="c n">${e.length}</td><td style="white-space:normal">${e.map(x=>formatTimeOut(x[0])+' ('+x[3]+'s)').join(' · ')}</td></tr>`:''}).join('');
  EXP={n:'Received_'+date,sh:[['Received',[['Employee',dmy(date),'Month total'],...R,['TOTAL',R.reduce((s,x)=>s+x[1],0),R.reduce((s,x)=>s+x[2],0)]]]]};
  return`<div class="bar"><label>Duration: <input id="rs" value="${S.recv}" style="width:90px"></label><button class="b p" id="rsb">Apply</button></div>
  <div class="card"><table style="min-width:500px"><thead><tr><th>Employee</th><th class="c">${dmy(date||'')}</th><th class="c">Month total (${month})</th></tr></thead><tbody>${rows}</tbody></table></div>`
}

function data(){
  const ds=Object.keys(S.idx).sort().reverse();const fm=t=>t?new Date(t).toLocaleString():'\u2014';
  const rows=ds.map(d=>`<tr><td class="n">${dmy(d)}</td><td>${S.idx[d].a}</td><td>${esc(S.idx[d].f||'\u2014')}</td><td>${fm(S.idx[d].t)}</td><td><button class="b" data-del="${d}">Delete</button></td></tr>`).join('')||'<tr><td colspan=5 class="empty">No data yet</td></tr>';
  return`<div class="card pad"><h2>Storage</h2><p>${DB?'<span class="chip good">\u25cf Database connected</span>':'<span class="chip bad">\u25cf Local storage</span>'}</p></div>
  <div class="bar"><input type="file" id="f" accept=".xlsx,.xls"><span class="tag">Import Agent State Detail Report (xlsx).</span></div>
  <div class="card"><table style="min-width:640px"><thead><tr><th>Date</th><th>Agents</th><th>Source file</th><th>Imported</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  <h2>Backup &amp; restore</h2><div class="bar"><button class="b p" id="bk">⬇ Backup all data</button><label class="tag">Restore: <input type="file" id="rf" accept=".json"></label></div>`
}

let EXP=null;
const rcnt=o=>(o.recv[1]||0)+(o.recv[2]||0);
const nv=o=>viol(date,o).filter(v=>!exd(date,o.name,v.t)).length;
function copyBox(){const m=document.createElement('div');m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px';
  const tsv=i=>EXP.sh[i][1].map(r=>r.map(c=>String(c==null?'':c).replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n');
  m.innerHTML=`<div class="card" style="padding:20px;width:min(720px,100%);overflow:visible;margin:0"><h2 style="margin-top:0">Copy to Excel</h2><div class="bar"><button class="b p" id="cc">Copy</button><button class="b" id="cx">Close</button></div><textarea id="ct" readonly style="width:100%;height:240px;font:12px monospace"></textarea></div>`;
  document.body.appendChild(m);const ta=m.querySelector('#ct');ta.value=tsv(0);
  m.querySelector('#cx').onclick=()=>m.remove();
  m.querySelector('#cc').onclick=async()=>{ta.select();try{await navigator.clipboard.writeText(ta.value);alert('Copied!')}catch(e){}}
}
async function exportX(){if(!EXP)return;const wb=XLSX.utils.book_new();EXP.sh.forEach(s=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s[1]),s[0]));
  try{XLSX.writeFile(wb,EXP.n+'.xlsx');return}catch(e){copyBox()}}

function render(){
  $('#nav').innerHTML=[['dash','Dashboard'],['mon','Monthly Report'],['data','Data'],['log','Audit Log']].map(t=>`<button class="${tab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('');
  const ds=Object.keys(S.idx).sort();if(!date)date=ds[ds.length-1]||new Date().toISOString().slice(0,10);if(tab!=='mon'||!month)month=date.slice(0,7);
  const lm=tab==='mon'?month:date.slice(0,7);if(DB&&!LOADED[lm]&&(tab==='dash'||tab==='mon')){$('#app').innerHTML='<div class="empty">Loading…</div>';loadMonth(lm).then(render);return}
  if(tab==='log'&&LOGS===null){loadLogs().then(render);return}
  const bar=tab==='dash'||tab==='rec'?`<div class="bar"><button class="b" data-step="-1">◀</button><input type="date" id="dt" value="${date}"><button class="b" data-step="1">▶</button>${tab==='dash'?`<input id="q" placeholder="Search..." value="${window.Q||''}">`:''}<button class="b p" data-exp="1" style="margin-left:auto">⬇ Export Excel</button></div>`:tab==='mon'?`<div class="bar"><input type="month" id="mo" value="${month}"><button class="b p" data-exp="1">⬇ Export Excel</button><button class="b" onclick="print()">Print</button></div>`:'';
  $('#app').innerHTML=bar+({dash,mon:monthly,rec:recv,data,log:logv}[tab])();
  if(tab==='rec')month=date.slice(0,7)}

document.addEventListener('click',e=>{const t=e.target;let x;
  if(x=t.closest('[data-tab]')){tab=x.dataset.tab;LOGS=null;render()}
  else if(x=t.closest('[data-ex]')){const k=x.dataset.ex,on=!S.ex[k];if(on)S.ex[k]=1;else delete S.ex[k];persistMap('ex',k);render()}
  else if(x=t.closest('[data-step]')){const d=new Date(date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+ +x.dataset.step);date=d.toISOString().slice(0,10);render()}
  else if(x=t.closest('[data-del]')){if(confirm('Delete?'))delDay(x.dataset.del)}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='dt'&&t.value){date=t.value;month=date.slice(0,7);render()}
  else if(t.id==='mo'&&t.value){month=t.value;render()}
  else if(t.id==='f'&&t.files[0])importFile(t.files[0]);
  else if(t.dataset.sh){const k=date+'|'+t.dataset.sh;S.shifts[k]=t.value;persistMap('sh',k);render()}
});
render();
document.addEventListener('click',e=>{if(e.target.closest('[data-exp]'))exportX();if(e.target.id==='th'){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0b1020';r.dataset.theme=d?'light':'dark'}});
document.addEventListener('input',e=>{if(e.target.id==='q'){window.Q=e.target.value;render()}});
document.addEventListener('click',e=>{if(e.target.id==='so')firebase.auth().signOut()});
boot();
</script></body></html>
